<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Furnace Area</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --text:#1c2530; --muted:#6b7684; --border:#dde3ea;
  --accent:#2563eb; --accent-d:#1d4ed8; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --head:#eef2f7; --input-bg:#ffffff; --shadow:0 1px 3px rgba(20,30,50,.08);
}
[data-theme="dark"]{
  --bg:#11151c; --panel:#1a2028; --text:#e6eaf0; --muted:#9aa5b3; --border:#2c3542;
  --accent:#3b82f6; --accent-d:#60a5fa; --ok:#22c55e; --warn:#f59e0b; --bad:#f87171;
  --head:#222a35; --input-bg:#151a21; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.topbar .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
.topbar .brand small{color:var(--muted);font-weight:400;font-size:12px;}
.userbox{display:flex;align-items:center;gap:10px;font-size:13px;}
.pill{padding:2px 10px;border-radius:20px;background:var(--head);border:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
.icon-btn{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;}
.icon-btn:hover{background:var(--head);}
.wrap{max-width:1100px;margin:0 auto;padding:18px;}
.center-wrap{max-width:420px;margin:60px auto;padding:0 16px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--shadow);}
.card h2{margin-top:0;}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;}
input,select,textarea{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;}
textarea{resize:vertical;min-height:44px;}
button.btn{cursor:pointer;border:none;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;}
button.btn:hover{background:var(--accent-d);}
button.btn.secondary{background:var(--head);color:var(--text);border:1px solid var(--border);}
button.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
button.btn.danger{background:var(--bad);color:#fff;}
button.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{font-size:13px;margin-top:10px;padding:9px 11px;border-radius:8px;}
.msg.err{background:#fee2e2;color:#991b1b;}
[data-theme="dark"] .msg.err{background:#3a1a1a;color:#f87171;}
.msg.ok{background:#dcfce7;color:#166534;}
[data-theme="dark"] .msg.ok{background:#12301f;color:#4ade80;}
.msg.info{background:var(--head);color:var(--muted);}
.linklike{color:var(--accent);cursor:pointer;text-decoration:underline;font-size:13px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;}
.menu-tile{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px 18px;text-align:center;cursor:pointer;box-shadow:var(--shadow);}
.menu-tile:hover{border-color:var(--accent);}
.menu-tile .emoji{font-size:34px;}
.menu-tile h3{margin:10px 0 4px;}
.menu-tile p{color:var(--muted);font-size:12.5px;margin:0;}
.chk-list{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.chk-item{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;}
.chk-item:hover{border-color:var(--accent);}
.chk-item .name{font-weight:600;}
.chk-item .sub{font-size:12px;color:var(--muted);}
.chk-item.has-op{border-left:6px solid var(--oc);}
.op-pill{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:700;}
.op-legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:14px;align-items:center;}
.op-legend .op-pill{margin-top:0;}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:6px;}
.breadcrumb span{cursor:pointer;color:var(--accent);}
.crumb-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.crumb-btn{background:var(--panel);border:1px solid var(--border);color:var(--accent);padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);}
.crumb-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.crumb-current{padding:7px 14px;font-size:12.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:20px;}
.crumb-sep{color:var(--muted);font-size:13px;}
.formbar{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:16px;}
.formbar .fld{min-width:150px;flex:1;}
.formbar label{margin:0 0 5px;}
.status-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.3px;}
.status-badge.draft{background:#fef3c7;color:#92400e;}
.status-badge.final{background:#dcfce7;color:#166534;}
.status-badge.pending{background:#dbeafe;color:#1e40af;}
[data-theme="dark"] .status-badge.draft{background:#3a2c0f;color:#fbbf24;}
[data-theme="dark"] .status-badge.final{background:#12301f;color:#4ade80;}
[data-theme="dark"] .status-badge.pending{background:#1e2f4d;color:#60a5fa;}
.sig-box.sig-inactive{opacity:.5;}
.sig-box.sig-inactive .sig-pad{pointer-events:none;}
.locked-box{background:var(--panel);border:1px dashed var(--border);border-radius:14px;padding:60px 20px;text-align:center;color:var(--muted);}
.locked-box .big{font-size:40px;}
.savebar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;z-index:40;}
.autosave-note{font-size:12px;color:var(--muted);margin-right:auto;}
table.chk-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px;}
table.chk-table th{background:var(--head);text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);}
table.chk-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;}
table.chk-table tr.kat-row td{background:var(--head);font-weight:700;padding:6px 8px;font-size:12.5px;}
.kode-badge{display:inline-block;background:var(--head);border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700;color:var(--accent);}
.hasil-sel{width:76px;}
.hasil-sel.v{color:var(--ok);font-weight:700;}
.hasil-sel.x{color:var(--bad);font-weight:700;}
.hasil-sel.o{color:var(--warn);font-weight:700;}
.catatan-inp{min-width:150px;}
.legend{font-size:12px;color:var(--muted);margin:6px 0 14px;}
.sig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px;}
.sig-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;}
.sig-box h4{margin:0 0 4px;font-size:13px;}
.sig-box .name{font-size:12px;color:var(--muted);margin-bottom:6px;}
canvas.sig-pad{width:100%;height:110px;border:1px dashed var(--border);border-radius:8px;background:var(--input-bg);touch-action:none;}
.sig-actions{display:flex;justify-content:space-between;margin-top:6px;}
.sig-actions button{font-size:11px;padding:4px 8px;}
.item-col{min-width:150px;}
.std-col{color:var(--muted);font-size:12px;min-width:170px;}
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:var(--input-bg);color:var(--muted);font-size:11px;cursor:pointer;flex-shrink:0;padding:0;line-height:1;}
.info-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.item-col-wrap{display:flex;align-items:flex-start;gap:6px;}
.catatan-cell{display:flex;align-items:center;gap:6px;}
.catatan-cell .catatan-inp{flex:1;min-width:0;}
.chart-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;}
.chart-leg{display:inline-flex;align-items:center;gap:5px;} .chart-leg .seg{display:inline-block;width:12px;height:12px;border-radius:3px;}
.chart-row{display:flex;align-items:center;gap:10px;margin:8px 0;}
.chart-label{width:68px;font-weight:700;font-size:13px;flex-shrink:0;}
.chart-bar{flex:1;display:flex;height:28px;border-radius:7px;overflow:hidden;background:var(--input-bg);border:1px solid var(--border);}
.chart-bar.empty{align-items:center;padding-left:10px;font-size:12px;color:var(--muted);}
.chart-bar .seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;min-width:0;}
.type-chk-bar{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.type-chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:4px 10px;border:1px solid var(--border);border-radius:16px;background:var(--panel);}
.type-chk input{width:auto;margin:0;}
.chart-sub{font-size:11px;color:var(--muted);margin:-4px 0 6px 0;padding-left:78px;}
.chart-pct{width:44px;text-align:right;font-weight:700;font-size:13px;flex-shrink:0;}
.seg.selesai{background:var(--ok);} .seg.progress{background:var(--accent);} .seg.salah{background:var(--warn);} .seg.belum{background:var(--bad);}
.dash-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0 4px;}
.dash-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);}
.dash-card:hover{border-color:var(--accent);}
.dash-card .num{font-size:26px;font-weight:700;}
.dash-card .lbl{font-size:12px;color:var(--muted);}
.dash-card.c-selesai .num{color:var(--ok);} .dash-card.c-progress .num{color:var(--accent);}
.dash-card.c-belum .num{color:var(--bad);} .dash-card.c-salah .num{color:var(--warn);}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:700;}
.pill.selesai{background:#dcfce7;color:#166534;} .pill.progress{background:#dbeafe;color:#1e40af;}
.pill.belum{background:#fee2e2;color:#991b1b;} .pill.salah{background:#fef3c7;color:#92400e;}
[data-theme="dark"] .pill.selesai{background:#12301f;color:#4ade80;} [data-theme="dark"] .pill.progress{background:#1e2f4d;color:#60a5fa;}
[data-theme="dark"] .pill.belum{background:#3b1717;color:#f87171;} [data-theme="dark"] .pill.salah{background:#3a2c0f;color:#fbbf24;}
tr.dash-row{cursor:pointer;} tr.dash-row:hover td{background:rgba(37,99,235,.07);} tr.dash-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
tr.dash-row.dash-last td{background:rgba(37,99,235,.10);}
tr.dash-row.belum td:first-child{box-shadow:inset 3px 0 0 var(--bad);} tr.dash-row.salah td:first-child{box-shadow:inset 3px 0 0 var(--warn);}
tr.dash-row.progress td:first-child{box-shadow:inset 3px 0 0 var(--accent);} tr.dash-row.selesai td:first-child{box-shadow:inset 3px 0 0 var(--ok);}
.info-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;cursor:pointer;}
.info-modal-box{background:var(--panel);color:var(--text);border-radius:12px;max-width:420px;width:100%;max-height:70vh;overflow-y:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3);cursor:default;}
.info-modal-title{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--accent);}
.info-modal-text{font-size:14px;line-height:1.5;white-space:pre-wrap;}
.info-modal-hint{margin-top:12px;font-size:11px;color:var(--muted);text-align:center;}
/* ================= ROLE/SHIFT NOTIFICATIONS ================= */
.notif-wrap{position:relative;display:inline-flex;align-items:center;}
.notif-btn{position:relative;min-width:40px;}
.notif-count{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:10px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:18px;border:2px solid var(--panel);}
.notif-panel{position:fixed;right:16px;top:58px;width:min(430px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.18);z-index:200;padding:12px;}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.notif-head b{font-size:14px;}
.notif-meta{font-size:11px;color:var(--muted);}
.notif-item{border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;background:var(--input-bg);}
.notif-item.actionable{cursor:pointer;border-color:var(--accent);}
.notif-item.actionable:hover{background:var(--head);}
.notif-item .nt-title{font-weight:700;font-size:13px;margin-bottom:4px;}
.notif-item .nt-body{font-size:12px;line-height:1.45;color:var(--muted);}
.notif-item .nt-tag{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:12px;font-size:10px;font-weight:700;background:var(--head);color:var(--muted);}
.notif-item.actionable .nt-tag{background:#dbeafe;color:#1e40af;}
.notif-empty{padding:18px 8px;text-align:center;color:var(--muted);font-size:12px;}
.notif-warn{margin:8px 0;padding:9px 10px;border-radius:8px;background:#fff7ed;color:#9a3412;font-size:12px;}
[data-theme="dark"] .notif-warn{background:#3a2515;color:#fdba74;}

@media(max-width:720px){
  .grid2{grid-template-columns:1fr;}
  .menu-grid{grid-template-columns:1fr;}
  table.chk-table{font-size:12px;}
  .std-col{display:none;}
  .catatan-cell .catatan-inp{min-width:90px;}
}
@media print{
  .topbar,.savebar,.formbar button,.no-print{display:none !important;}
  body{background:#fff;color:#000;}
  .wrap{max-width:100%;padding:0;}
  table.chk-table th, table.chk-table td{border-color:#999;}
}
.hidden{display:none !important;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body data-theme="light">

</div>
<div id="notifPanel" class="notif-panel hidden"></div>

<div class="wrap" id="app"></div>

 * (lihat getChecklistDefs_ di Code.gs). Kalau gagal, cadangan dipakai.
 * Dibungkus satu promise bersama supaya hanya ada SATU request jaringan. */
let _checklistDefsPromise = null;
function loadChecklistDefs(){
  if(_checklistDefsPromise) return _checklistDefsPromise;
  _checklistDefsPromise = api("getChecklistDefs", {}).then(defs=>{
    Object.keys(defs||{}).forEach(k=>{
      if(defs[k] && defs[k].items && defs[k].items.length) CHECKLIST_DATA[k] = defs[k];
    });
  }).catch(e=>{ /* keep whatever CHECKLIST_DATA already has - silent */ });
  return _checklistDefsPromise;
}

// yyyy-mm-dd dari tanggal LOKAL (jangan toISOString(): UTC menggeser tanggal
// mundur sehari untuk zona waktu positif seperti Asia/Jakarta).
function localDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function todayStr(){ return localDateStr(new Date()); }
// Tanggal OPERASIONAL: shift Malam (23:00-07:00) dicatat pada tanggal hari
// MULAINYA, jadi sebelum jam 07:00 tanggalnya masih kemarin. Aturan sama
// dengan server (currentOperationalDate_ di Code.gs).
function operationalDateStr(now){
  return localDateStr(new Date((now || new Date()).getTime() - 7*3600*1000));
}

/* ======================= TIERED APPROVAL STAGES =======================
 * Draft -> Menunggu Supervisor -> Menunggu Superintendent -> Final.
 * Tiap langkah maju butuh role tahap itu menandatangani kotaknya sendiri
 * lalu menekan tombol kirim. Engineer boleh menandatangani/memajukan tahap
 * apa pun dan satu-satunya yang bisa mengembalikan ke Draft. */
const STAGE_ORDER = ["Draft","Menunggu Supervisor","Menunggu Superintendent","Final"];
const STAGE_ACTIVE_ROLE = {
  "Draft": ["operator","supervisor"],
  "Menunggu Supervisor": ["supervisor"],
  "Menunggu Superintendent": ["superintendent"],
  "Final": []
};
const STAGE_NEXT = {
  "Draft": {action:"submitToSupervisor", nextStatus:"Menunggu Supervisor", byRole:"operator", needsSig:"operator", label:"Kirim ke Supervisor"},
  "Menunggu Supervisor": {action:"submitToSuperintendent", nextStatus:"Menunggu Superintendent", byRole:"supervisor", needsSig:"supervisor", label:"Kirim ke Superintendent"},
  "Menunggu Superintendent": {action:"submitFinal", nextStatus:"Final", byRole:"superintendent", needsSig:"superintendent", label:"✅ Kirim Laporan (Final)"}
};
function statusBadgeClass(status){
  if(status === "Final") return "final";
  if(status === "Menunggu Supervisor" || status === "Menunggu Superintendent") return "pending";
  return "draft";
}
function isActiveRoleForStatus(role, status){
  if(role === "engineer") return true;
  return (STAGE_ACTIVE_ROLE[status] || []).indexOf(role) !== -1;
}

// Baris tombol pill sebagai breadcrumb. Langkah TERAKHIR tanpa `fn`.
function crumbBar(steps){
  const parts = steps.map((s,i)=>{
    const isLast = i === steps.length-1;
    if(!s.fn || isLast){
      return `<span class="crumb-current">${s.label}</span>`;
    }
    return `<button class="crumb-btn" onclick="${s.fn}">${s.label}</button>`;
  });
  return `<div class="crumb-bar no-print">${parts.join('<span class="crumb-sep">›</span>')}</div>`;
}

async function api(action, payload){
  payload = payload || {};
  payload.action = action;
  if(SESSION && SESSION.token) payload.token = SESSION.token;
  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"}, // avoid CORS preflight
    body: JSON.stringify(payload)
  });
  let json;
  try{ json = await res.json(); }
  catch(e){ throw new Error("Respon server tidak valid. Cek URL Apps Script / deployment."); }
  if(!json.ok){ throw new Error(json.error || "Terjadi kesalahan."); }
  return json.data;
}

/* ======================= ROLE/SHIFT NOTIFICATIONS ======================= */
function initNotificationPolling(){
  if(notificationTimer) clearInterval(notificationTimer);
  notificationTimer = null;
  notificationFirstLoad = true;
  notificationLastKey = "";
  if(!SESSION || !["supervisor","superintendent"].includes(SESSION.role)) return;
  refreshNotifications(true);
  notificationTimer = setInterval(()=>refreshNotifications(true), 60000);
}

async function refreshNotifications(silent){
  if(!SESSION || !["supervisor","superintendent"].includes(SESSION.role)) return;
  try{
    const data = await api("getNotifications", {});
    notificationData = data || {items:[],count:0};
    // Jam kerja akun berputar mengikuti rotasi Group - perbarui label di
    // pojok atas dari data server supaya selalu sesuai hari ini.
    if(notificationData.assignedShift !== undefined && SESSION){
      const ns = notificationData.assignedShift || "", ng = notificationData.assignedGroup || "";
      if(SESSION.shift !== ns || SESSION.shiftGroup !== ng){
        SESSION.shift = ns; SESSION.shiftGroup = ng;
        localStorage.setItem("cf_session", JSON.stringify(SESSION));
        setUserBox();
      }
    }
    const actionableIds = (notificationData.items||[]).filter(x=>x.actionable).map(x=>x.id).sort();
    const key = actionableIds.join("|");
    const isNew = !notificationFirstLoad && key !== notificationLastKey && actionableIds.length > 0;
    notificationLastKey = key;
    notificationFirstLoad = false;
    renderNotificationBadge();
    if(isNew) showBrowserNotification(notificationData);
    if(!document.getElementById("notifPanel").classList.contains("hidden")) renderNotificationPanel();
  }catch(e){
    // Notification failure must never interrupt the checklist itself.
  }
}

function renderNotificationBadge(){
  const count = notificationData && Number(notificationData.count || 0) || 0;
  const badge = document.getElementById("notifCount");
  if(!badge) return;
  badge.textContent = count > 99 ? "99+" : String(count);
  badge.classList.toggle("hidden", count <= 0);
}

function toggleNotifications(){

    panel.classList.remove("hidden");

}

function renderNotificationPanel(){
  const panel = document.getElementById("notifPanel");
  if(!panel) return;
  const d = notificationData;
  if(!d){
    panel.innerHTML = `<div class="notif-empty"><span class="spinner"></span> Memuat notifikasi...</div>`;
    return;
  }
  const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let html = `<div class="notif-head"><b>🔔 Notifikasi</b><span class="notif-meta">${esc(d.currentShift||"")} • ${esc(d.operationalDate||"")}</span></div>`;
  if(d.configured === false){
    html += `<div class="notif-warn">⚠️ ${esc(d.message||"SHIFT belum diatur.")}</div>`;
  }else if(d.active === false){
    html += `<div class="notif-warn">ℹ️ ${d.assignedShift==="Off"
      ? `Group <b>${esc(d.assignedGroup||"-")}</b> sedang <b>OFF (libur)</b> pada tanggal ${esc(d.operationalDate||"")}. Notifikasi aktif lagi saat Group Anda masuk shift.`
      : `Hari ini ${d.assignedGroup ? "Group <b>"+esc(d.assignedGroup)+"</b> " : "akun Anda "}bertugas <b>${esc(d.assignedShift||"-")}</b>. Saat ini sistem berada di <b>${esc(d.currentShift||"-")}</b>. Notifikasi akan aktif saat masuk jam shift Anda.`}</div>`;
  }
  const items = d.items || [];
  if(!items.length){
    html += `<div class="notif-empty">Tidak ada checklist yang perlu diperhatikan saat ini.</div>`;
  }else{
    html += items.map((item,idx)=>{
      const tag = item.actionable ? "Perlu tindakan" : (item.type === "missing" ? "Belum diisi" : "Monitoring");
      const cls = item.actionable ? "notif-item actionable" : "notif-item";
      return `<div class="${cls}" ${item.actionable ? `onclick="openNotificationByIndex(${idx})"` : ""}>
        <div class="nt-title">${item.actionable ? "🔴" : "ℹ️"} ${esc(item.title)}</div>
        <div class="nt-body">${esc(item.message)}</div>
        <span class="nt-tag">${esc(tag)}</span>
      </div>`;
    }).join("");
  }
  html += `<div class="notif-meta" style="padding:6px 4px 2px;">Server: ${esc(d.serverTime||"")}</div>`;
  panel.innerHTML = html;
}

function openNotificationByIndex(idx){
  const item = notificationData && notificationData.items ? notificationData.items[idx] : null;
  openNotificationChecklist(item);
}

async function openNotificationChecklist(item){
  if(!item || !item.actionable) return;
  const panel = document.getElementById("notifPanel");
  if(panel) panel.classList.add("hidden");
  try{
    await openChecklistSetup(item.checklistName);
    const dateEl = document.getElementById("su-tanggal");
    const shiftEl = document.getElementById("su-shift");
    if(dateEl) dateEl.value = item.tanggal;
    if(shiftEl) shiftEl.value = item.shift;
    await openChecklistDirect();
  }catch(e){
    alert("Gagal membuka checklist dari notifikasi: " + e.message);
  }
}

async function showBrowserNotification(data){
  try{
    if(!("Notification" in window)) return;
    if(Notification.permission === "default") await Notification.requestPermission();
    if(Notification.permission !== "granted") return;
    const item = (data.items||[]).find(x=>x.actionable);
    if(!item) return;
    const title = "Checklist Furnace - Perlu Pengecekan";
    const body = item.message;
    if("serviceWorker" in navigator){
      const reg = await navigator.serviceWorker.getRegistration("/Checklist-record/");
      if(reg && reg.showNotification){
        await reg.showNotification(title,{body,icon:"/Checklist-record/icons/icon-192.png",tag:item.id,data:{url:"/Checklist-record/"}});
        return;
      }
    }
    new Notification(title,{body});
  }catch(e){ /* browser notification is optional */ }
}

/* ======================= DASHBOARD RANGKUMAN =======================
 * Rangkuman semua checklist untuk rentang tanggal (action "getDashboard"
 * di Code.gs): shift belum isi, perlu dicek, progress; plus rapor per
 * Group dan per Shift. Filter dihitung di sini tanpa memanggil server. */
const DASH_STATE_LABEL = {belum:"Belum isi", progress:"Progress", salah:"Perlu dicek", selesai:"Selesai"};
let DASH = {rows:[], checklists:[], rapor:"all", typeHide:{}, filter:{chk:"", shift:"", grp:"", state:"todo"}};

function dashEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderDashboard(fromCache){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(fromCache !== true) CURRENT.fromDashboard = false; // dibuka dari menu = mulai baru
  const endD = new Date(Date.now() - 7*3600*1000); // tanggal operasional
  const startD = new Date(endD); startD.setDate(startD.getDate() - 6);
  const startVal = (DASH.start) || localDateStr(startD);
  const endVal = (DASH.end) || localDateStr(endD);
  app.appendChild(el(`
    ${crumbBar([{label:"🏠 Menu Utama", fn:"renderHome()"}, {label:"Dashboard Rangkuman"}])}
    <h2>📊 Dashboard Rangkuman</h2>
    <div class="card" style="padding:16px;">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
        <div style="flex:1;min-width:140px;"><label style="font-size:12px;color:var(--muted);">Tanggal Mulai</label><input type="date" id="dash-start" value="${startVal}"></div>
        <div style="flex:1;min-width:140px;"><label style="font-size:12px;color:var(--muted);">Tanggal Selesai</label><input type="date" id="dash-end" value="${endVal}"></div>
        <div><button class="btn" onclick="loadDashboard()">Tampilkan</button></div>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px;">Maksimal 62 hari per tampilan. Group "seharusnya" dihitung dari jadwal rotasi (2 hari Pagi, 2 hari Siang, 2 hari Malam, 2 hari Off).</div>
    </div>
    <div id="dash-body"></div>
  `));
  // Kembali dari checklist: tampilkan data yang sudah dimuat seketika,
  // pulihkan filter & scroll, lalu segarkan diam-diam tanggal yang dibuka.
  if(fromCache === true && DASH.rows && DASH.rows.length){
    renderDashboardBody();
    window.scrollTo(0, DASH.scrollY || 0);
    if(DASH.opened) refreshDashboardDay(DASH.opened.tanggal);
    return;
  }
  loadDashboard();
}

const DASH_SHIFT_ORDER = {Pagi:0, Siang:1, Malam:2};
async function refreshDashboardDay(tanggal){
  try{
    const data = await api("getDashboard", {startDate: tanggal, endDate: tanggal});
    if(!document.getElementById("dash-body")) return;          // sudah pindah halaman
    const fresh = data.rows || [];
    const before = JSON.stringify(DASH.rows.filter(r=>r.tanggal===tanggal));
    if(before === JSON.stringify(fresh)) return;                // tidak berubah -> jangan geser tampilan
    const order = {}; DASH.checklists.forEach((c,i)=>{ order[c.key] = i; });
    DASH.rows = DASH.rows.filter(r=>r.tanggal!==tanggal).concat(fresh).sort((a,b)=>
      a.tanggal < b.tanggal ? -1 : a.tanggal > b.tanggal ? 1 :
      (DASH_SHIFT_ORDER[a.shift]||0) - (DASH_SHIFT_ORDER[b.shift]||0) ||
      (order[a.key]||0) - (order[b.key]||0));
    const y = window.scrollY;
    renderDashboardBody();
    window.scrollTo(0, y);
  }catch(e){ /* diam: tampilan lama tetap dipakai */ }
}

async function backToDashboard(){
  if(dirty){
    clearTimeout(saveTimer);
    await saveProgress(false);                                  // simpan dulu perubahan terakhir
    if(dirty && !confirm("Perubahan terakhir belum berhasil tersimpan. Tetap kembali ke dashboard?")) return;
    dirty = false;
  }
  renderDashboard(true);
}

async function loadDashboard(){
  const start = document.getElementById("dash-start").value;
  const end = document.getElementById("dash-end").value;
  const body = document.getElementById("dash-body");
  if(!start || !end){ body.innerHTML = `<div class="msg info">Isi tanggal mulai dan selesai.</div>`; return; }
  DASH.start = start; DASH.end = end;
  body.innerHTML = `<div class="msg info"><span class="spinner"></span> Memuat rangkuman...</div>`;
  try{
    const data = await api("getDashboard", {startDate:start, endDate:end});
    DASH.rows = data.rows || [];
    DASH.checklists = data.checklists || [];
    renderDashboardBody();
  }catch(e){
    body.innerHTML = `<div class="msg" style="background:#fee2e2;color:#991b1b;">${dashEsc(e.message)}</div>`;
  }
}

function dashCount(rows){
  const c = {total:rows.length, selesai:0, progress:0, belum:0, salah:0};
  rows.forEach(r=>{ c[r.state] = (c[r.state]||0) + 1; });
  return c;
}

// Jenis laporan untuk panel Rapor: "all" = semua digabung, "<key>" = satu
// checklist, "record" = Record (belum ada datanya).
function dashRaporRows(rows){
  const j = DASH.rapor || "all";
  if(j === "record") return [];
  if(j === "all") return rows;
  return rows.filter(r=>r.key === j);
}
function dashRaporLabel(){
  const j = DASH.rapor || "all";
  if(j === "all") return "Semua checklist";
  if(j === "record") return "Record";
  const c = DASH.checklists.find(c=>c.key === j);
  return c ? c.title : j;
}

function dashRaporTable(title, groups){
  // groups: [{label, rows}] - satu baris per group/shift, kolom per status
  const body = groups.map(g=>{
    const k = dashCount(g.rows);
    if(!k.total) return `<tr><td><b>${dashEsc(g.label)}</b></td><td colspan="6" style="color:var(--muted);">${(DASH.rapor||"all")==="record" ? "belum tersedia" : "tidak ada data"}</td></tr>`;
    const pct = Math.round(k.selesai*100/k.total);
    return `<tr><td><b>${dashEsc(g.label)}</b></td>
      <td style="color:var(--ok);font-weight:700;">${k.selesai}</td>
      <td style="color:var(--accent);font-weight:700;">${k.progress}</td>
      <td style="color:var(--bad);font-weight:700;">${k.belum}</td>
      <td style="color:var(--warn);font-weight:700;">${k.salah}</td>
      <td>${k.total}</td>
      <td><b>${pct}%</b></td></tr>`;
  }).join("");
  return `<h3 style="margin:18px 0 8px;font-size:15px;">${title}</h3>
    <div style="overflow-x:auto;"><table class="chk-table"><thead><tr><th>&nbsp;</th><th>Selesai</th><th>Progress</th><th>Belum isi</th><th>Perlu dicek</th><th>Total</th><th>% Selesai</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

// Grafik batang bertumpuk (HTML/CSS murni): satu batang per item, panjang
// segmen = persentase tiap status dari total item itu.
// items: [{label, rows, emptyText?}]
function dashStackedChart(title, items, labelWidth){
  const segs = [["selesai","Selesai"],["progress","Progress"],["salah","Perlu dicek"],["belum","Belum isi"]];
  const legend = segs.map(([k,l])=>`<span class="chart-leg"><i class="seg ${k}"></i>${l}</span>`).join("");
  const lw = labelWidth ? ` style="width:${labelWidth}px;"` : "";
  const bars = items.map(g=>{
    const k = dashCount(g.rows);
    if(!k.total) return `<div class="chart-row"><div class="chart-label"${lw}>${dashEsc(g.label)}</div><div class="chart-bar empty">${dashEsc(g.emptyText || "tidak ada data")}</div><div class="chart-pct">-</div></div>`;
    const parts = segs.map(([key,label])=>{
      const n = k[key]; if(!n) return "";
      const w = n*100/k.total;
      return `<div class="seg ${key}" style="width:${w}%;" title="${label}: ${n} (${Math.round(w)}%)">${w>=9 ? n : ""}</div>`;
    }).join("");
    return `<div class="chart-row"><div class="chart-label"${lw}>${dashEsc(g.label)}</div><div class="chart-bar">${parts}</div><div class="chart-pct">${Math.round(k.selesai*100/k.total)}%</div></div>
      <div class="chart-sub"${lw ? ` style="padding-left:${labelWidth+10}px;"` : ""}>selesai ${k.selesai} · progress ${k.progress} · cek ${k.salah} · belum isi ${k.belum} (dari ${k.total})</div>`;
  }).join("");
  return `${title ? `<h3 style="margin:22px 0 8px;font-size:15px;">${title}</h3>` : ""}
    <div class="chart-wrap"><div class="chart-legend">${legend}</div>${bars}
    <div style="font-size:11px;color:var(--muted);margin-top:8px;">Persen di kanan = % selesai. Angka di dalam batang = jumlah. Sentuh/arahkan ke segmen untuk rincian.</div></div>`;
}

function dashGroupChart(groups){
  const emptyText = (DASH.rapor||"all")==="record" ? "belum tersedia" : "tidak ada data";
  return dashStackedChart("Grafik Rapor per Group - " + dashEsc(dashRaporLabel()),
    groups.map(g=>Object.assign({emptyText}, g)));
}

// baris itu. Kalau "Belum isi", sistem membuat Draft kosong (sama seperti
// membuka lewat menu Checklist).
async function openDashboardRow(i){
  const r = DASH.view && DASH.view[i];
  if(!r) return;
  DASH.scrollY = window.scrollY;
  DASH.opened = {key: r.key, tanggal: r.tanggal, shift: r.shift};
  try{
    await openChecklistSetup(r.key);
    CURRENT.fromDashboard = true;
    const dateEl = document.getElementById("su-tanggal");
    const shiftEl = document.getElementById("su-shift");
    if(dateEl) dateEl.value = r.tanggal;
    if(shiftEl) shiftEl.value = r.shift;
    await openChecklistDirect();
  }catch(e){
    alert("Gagal membuka checklist: " + e.message);
  }
}

/* Membuka form checklist untuk Tanggal/Shift terpilih. Group di-resolve
 * backend (autoProvision:true membuat Draft kosong saat pertama dibuka). */
async function openChecklistDirect(){
  const tanggal = document.getElementById("su-tanggal").value;
  const shift = document.getElementById("su-shift").value;
  const statusBox = document.getElementById("su-status");
  if(!tanggal){ statusBox.innerHTML = `<div class="msg err">Pilih tanggal terlebih dahulu.</div>`; return; }
  CURRENT.tanggal = tanggal; CURRENT.shift = shift; CURRENT.group = null;
  statusBox.innerHTML = `<div class="msg info"><span class="spinner"></span> Memuat data...</div>`;
  try{
    // Tiga hal yang tidak saling bergantung dijalankan BERSAMAAN.
    const [rec] = await Promise.all([
      api("getChecklist", {checklistName: CURRENT.checklistKey, tanggal, shift, autoProvision: true}),
      loadPrevShiftHandover(),
      loadChecklistDefs()
    ]);
    CURRENT.group = rec.group || null;
    CURRENT.record = rec; // {found, status, dataJson, signatures, group, ...} or {found:false, group}
    renderChecklistForm();
  }catch(e){
    statusBox.innerHTML = `<div class="msg err">${e.message}</div>`;
  }
}

/* Dari dropdown Group di dalam form. Group BUKAN bagian kunci data - hanya
 * ada SATU record per Tanggal+Shift. Mengubahnya hanya mengganti label
 * siapa yang mengisi, dikirim pada autosave/submit berikutnya. */
function onGroupChange(newGroup){
  if(!newGroup || newGroup === CURRENT.group) return;
  const hadNoGroup = !CURRENT.group;
  CURRENT.group = newGroup;
  markDirty();
  if(hadNoGroup) renderChecklistForm();
}

/* Mencari catatan serah-terima shift sebelumnya (Pagi -> Malam hari
 * sebelumnya). Gagal = diam (banner tidak muncul). */
function prevShiftKey(tanggal, shift){
  if(shift === "Siang") return {tanggal, shift:"Pagi"};
  if(shift === "Malam") return {tanggal, shift:"Siang"};
  // Pagi -> Malam hari sebelumnya, murni waktu LOKAL (lihat localDateStr).
  const d = new Date(tanggal + "T00:00:00");
  d.setDate(d.getDate() - 1);
  return {tanggal: localDateStr(d), shift:"Malam"};
}

async function loadPrevShiftHandover(){
  CURRENT.prevHandover = null;
  CURRENT.prevOpenItems = {};
  try{
    const prev = prevShiftKey(CURRENT.tanggal, CURRENT.shift);
    // Tanpa `group` dan tanpa `autoProvision` dengan sengaja.
    const prevRec = await api("getChecklist", {
      checklistName: CURRENT.checklistKey, tanggal: prev.tanggal, shift: prev.shift
    });
    // `.handover` dan `.openItems` selalu diisi backend untuk semua role,
    // meski laporan sebelumnya Final (lihat extractContinuityInfo_).
    if(prevRec && prevRec.found){
      if(prevRec.handover){
        CURRENT.prevHandover = {text: prevRec.handover, shiftLabel: SHIFTS.find(s=>s.id===prev.shift).label, tanggal: prev.tanggal};
      }
      if(prevRec.openItems){
        CURRENT.prevOpenItems = prevRec.openItems;
      }
    }
  }catch(e){ /* silent - banner just won't show */ }
}

/* ======================= CHECKLIST FORM ======================= */
function canEditRole(){
  return SESSION.role === "operator" || SESSION.role === "supervisor" || SESSION.role === "engineer";
}
function isLockedForMe(rec){
  if(!rec || !rec.found) return false;
  if(rec.status !== "Final") return false;
  // Final: terkunci (tersembunyi) untuk operator & supervisor
  return (SESSION.role === "operator" || SESSION.role === "supervisor");
}

// Item (Hasil/Catatan) bisa diedit oleh role AKTIF pada tahap saat ini.
// Engineer selalu bisa mengedit semuanya (override penuh).
function itemsReadOnlyFor(statusEff){
  return !isActiveRoleForStatus(SESSION.role, statusEff);
}
// Status yang dibutuhkan agar kotak TTD tiap role bisa diedit.
const SIG_ROLE_STATUS = {"operator":"Draft","supervisor":"Menunggu Supervisor","superintendent":"Menunggu Superintendent"};
function sigEditableFor(role, statusEff){
  if(SESSION.role === "engineer") return true;
  if(SESSION.role !== role) return false;
  return statusEff === SIG_ROLE_STATUS[role];
}

function renderChecklistForm(){
  const app = document.getElementById("app");
  const def = CHECKLIST_DATA[CURRENT.checklistKey];
  const rec = CURRENT.record;
  app.innerHTML = "";

  // statusEff: status asli record bila ada, kalau tidak "Draft" - semua
  // pengecekan izin di bawah bersumber dari satu nilai ini.
  const statusEff = (rec && rec.found) ? rec.status : "Draft";
  const itemsReadOnly = itemsReadOnlyFor(statusEff);
  const isFinal = statusEff === "Final";

  // Isian tambahan per checklist (mis. "No Ladle"), disimpan di dataJson._meta
  let metaSaved = {};
  try{ metaSaved = (rec && rec.found && rec.dataJson) ? (JSON.parse(rec.dataJson)._meta || {}) : {}; }catch(e){}
  const escAttr = v => String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  const metaFields = (def.fields || []).map(f=>`
      <div class="fld"><label>${f.label}</label>
        <input type="text" class="meta-inp" data-meta="${f.id}" value="${escAttr(metaSaved[f.id])}" placeholder="${escAttr(f.placeholder||"")}" oninput="markDirty()" ${itemsReadOnly?"disabled":""} style="max-width:150px;">
      </div>`).join("");

  const header = el(`
    ${crumbBar([{label:"🏠 Menu Utama", fn:"renderHome()"}, (CURRENT.fromDashboard ? {label:"📊 Dashboard", fn:"backToDashboard()"} : {label:"Checklist", fn:"renderChecklistPicker()"}), {label:def.title, fn:`openChecklistSetup('${CURRENT.checklistKey}')`}, {label:"Isi Form"}])}
    ${CURRENT.fromDashboard ? `<div class="no-print" style="margin:4px 0 10px;"><button class="btn secondary" onclick="backToDashboard()">← Kembali ke Dashboard</button></div>` : ""}
    <h2>${def.title} &nbsp; <small style="color:var(--muted);font-weight:400;">v.${def.version}</small></h2>
    <div class="formbar">
      <div class="fld"><label>Tanggal</label><div><b>${CURRENT.tanggal}</b></div></div>
      <div class="fld"><label>Shift</label><div><b>${SHIFTS.find(s=>s.id===CURRENT.shift).label}</b></div></div>
      <div class="fld">
        <label>Group</label>
        <select id="group-select" onchange="onGroupChange(this.value)" ${itemsReadOnly?"disabled":""} title="Group hanya keterangan siapa yang mengisi - tidak memengaruhi data checklist di tanggal/shift ini.">
          <option value="" ${!CURRENT.group?"selected disabled":""}>-</option>
          ${GROUPS.map(g=>`<option value="${g}" ${CURRENT.group===g?"selected":""}>Group ${g}</option>`).join("")}
        </select>
      </div>
      ${metaFields}
      <div class="fld"><label>Status</label><div><span class="status-badge ${statusBadgeClass(statusEff)}">${rec && rec.found ? rec.status : 'BELUM ADA DATA'}</span></div></div>
      <div class="fld" style="flex:0;"><button class="btn secondary" onclick="openChecklistSetup('${CURRENT.checklistKey}')">Ganti Tanggal/Shift</button></div>
    </div>
  `);
  app.appendChild(header);

  if(!CURRENT.group){
    app.appendChild(el(`
      <div class="msg info" style="margin-bottom:16px;">
        ⚠️ Checklist untuk tanggal/shift ini belum pernah diisi Group manapun. Pilih Group pada dropdown di atas untuk mulai mengisi (pilihan ini akan otomatis diingat untuk pengisian berikutnya - dan berlaku untuk tanggal/shift ini saja, apa pun Group yang dipilih setelahnya).
      </div>
    `));
    return;
  }

  // Catatan serah-terima shift sebelumnya - tampil untuk SEMUA role, bahkan
  // bila shift itu sudah Final dan terkunci.
  if(CURRENT.prevHandover){
    app.appendChild(el(`
      <div class="msg info" style="margin-bottom:16px;">
        📝 <b>Catatan dari shift ${CURRENT.prevHandover.shiftLabel} (${CURRENT.prevHandover.tanggal}):</b><br>
        ${String(CURRENT.prevHandover.text).replace(/</g,"&lt;").replace(/\n/g,"<br>")}
      </div>
    `));
  }

  if(isLockedForMe(rec)){
    app.appendChild(el(`
      <div class="locked-box">
        <div class="big">🔒</div>
        <h3>Laporan periode ini sudah FINAL</h3>
        <p>Laporan untuk tanggal/shift ini sudah dikirim final oleh shift bertugas dan terkunci.<br>
        Hubungi Engineer jika perlu perubahan.</p>
      </div>
    `));
    return;
  }

  // baris item dikelompokkan per kategori
  const savedItems = (rec && rec.found && rec.dataJson) ? JSON.parse(rec.dataJson) : {};
  const prevOpenItems = CURRENT.prevOpenItems || {};
  let lastKat = null;
  let rows = "";
  def.items.forEach((it, idx)=>{
    if(it.kat !== lastKat){
      if(it.kat) rows += `<tr class="kat-row"><td colspan="5">${it.kat}</td></tr>`;
      lastKat = it.kat;
    }
    const saved = savedItems[idx] || {};
    const s = saved.awal || {};
    // Carry-over: bila shift SEBELUMNYA meninggalkan item ini sebagai X
    // (belum tertangani) dengan catatan, dan shift ini belum menulis apa
    // pun, isi catatan dengan catatan itu (tetap bisa diedit).
    let catatanVal = s.c || "";
    let carriedOver = false;
    if(!catatanVal && !s.h && prevOpenItems[idx]){
      catatanVal = "↪ Belum tertangani (shift sebelumnya): " + prevOpenItems[idx];
      carriedOver = true;
    }
    const kodeBadges = it.kode.split("").map(k=>`<span class="kode-badge" title="${KODE_KETERANGAN[k]||k}">${k}</span>`).join(" ");
    const escAttr = s => String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const itemTitleAttr = escAttr(it.item);
    const metodeText = it.kode.split("").map(k=>`${k} (${KODE_KETERANGAN[k]||k})`).join(", ");
    const modalBody = `Metode Pemeriksaan: ${metodeText}\n\nStandar Pemeriksaan:\n${it.std || "(tidak ada standar tercatat)"}`;
    const bodyAttr = escAttr(modalBody);
    rows += `
      <tr${carriedOver ? ' style="box-shadow:inset 3px 0 0 var(--bad);"' : ''}>
        <td class="item-col">
          <div class="item-col-wrap">
            <div>${it.pos ? `<div style="font-size:11px;color:var(--muted)">${it.pos}</div>`:""}${it.item}</div>
            <button type="button" class="info-btn" title="Lihat metode & standar pemeriksaan" onclick="showInfoModal(this.dataset.title, this.dataset.body)" data-title="${itemTitleAttr}" data-body="${bodyAttr}">ℹ</button>
          </div>
        </td>
        <td class="metode-col">${kodeBadges}</td>
        <td class="std-col">${it.std || ""}</td>
        <td>
          <select class="hasil-sel ${(s.h||"").toLowerCase()}" data-idx="${idx}" data-slot="awal" onchange="onHasilChange(this)" ${itemsReadOnly?"disabled":""}>
            <option value="" ${!s.h?"selected":""}>-</option>
            <option value="V" ${s.h==="V"?"selected":""}>V (Normal)</option>
            <option value="X" ${s.h==="X"?"selected":""}>X (Abnormal)</option>
            <option value="O" ${s.h==="O"?"selected":""}>O (Tertangani)</option>
          </select>
        </td>
        <td>
          <div class="catatan-cell">
            <input class="catatan-inp" id="catatan-${idx}" data-idx="${idx}" data-slot="awal" placeholder="Catatan / penanganan" value="${catatanVal.replace(/"/g,'&quot;')}" oninput="markDirty()" ${itemsReadOnly?"disabled":""}>
            <button type="button" class="info-btn" title="Lihat catatan lengkap" onclick="showCatatanModal(${idx})">🔍</button>
          </div>
        </td>
      </tr>`;
  });

  const table = el(`
    <div class="legend">Kode metode pemeriksaan — <span class="kode-badge">V</span> Visual &nbsp; <span class="kode-badge">S</span> Suara &nbsp; <span class="kode-badge">T</span> Sentuh &nbsp; <span class="kode-badge">B</span> Bau &nbsp; <span class="kode-badge">A</span> Alat &nbsp;|&nbsp; Hasil: V=Normal, X=Abnormal tidak tertangani, O=Abnormal tertangani &nbsp;|&nbsp; <span style="box-shadow:inset 3px 0 0 var(--bad);padding-left:4px;">garis merah</span> = belum tertangani dari shift sebelumnya</div>
    <div style="overflow-x:auto;">
    <table class="chk-table" id="chk-table">
      <thead>
        <tr>
          <th>Item Pemeriksaan</th>
          <th class="metode-col">Metode</th>
          <th>Standar Pemeriksaan</th>
          <th>Hasil</th>
          <th>Catatan / Penanganan</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  `);
  app.appendChild(table);

  // catatan serah-terima untuk shift BERIKUTNYA
  const handoverText = (savedItems._handover && savedItems._handover.text) || "";
  app.appendChild(el(`
    <div class="sig-box" style="margin-top:20px;">
      <h4>Catatan untuk Shift Berikutnya (jika ada issue)</h4>
      <textarea id="handover-note" rows="3" placeholder="Tulis catatan/serah-terima untuk shift berikutnya di sini (opsional)" oninput="markDirty()" ${itemsReadOnly?"disabled":""}>${handoverText.replace(/</g,"&lt;")}</textarea>
    </div>
  `));

  // tanda tangan - tiap kotak hanya bisa diedit role-nya sendiri pada
  // tahapnya (Engineer bisa mengedit ketiganya kapan saja).
  const savedSig = (rec && rec.found && rec.signatures) ? JSON.parse(rec.signatures) : {};
  app.appendChild(el(`<div class="sig-grid" id="sig-grid"></div>`));
  const sigWrap = document.getElementById("sig-grid");
  ["operator","supervisor","superintendent"].forEach(role=>{
    const editable = sigEditableFor(role, statusEff);
    const box = el(`
      <div class="sig-box ${editable?"":"sig-inactive"}">
        <h4>Tanda Tangan ${ROLE_LABEL[role]}</h4>
        <div class="name">${savedSig[role]?.name || (SESSION.role===role ? SESSION.fullName : "-")}</div>
        <canvas class="sig-pad" id="sig-${role}"></canvas>
        <div class="sig-actions">
          <button class="btn secondary" onclick="clearSig('${role}')" ${editable?"":"disabled"}>Bersihkan</button>
          <button class="btn ghost" onclick="setSigName('${role}')" ${editable?"":"disabled"}>Isi Nama</button>
        </div>
      </div>`);
    sigWrap.appendChild(box);
  });

  // savebar - "Simpan" untuk yang aktif di tahap ini, satu tombol
  // maju sesuai STAGE_NEXT, dan "Kembalikan ke Draft" dari status apa pun
  // selain Draft (hanya Engineer).
  const canSaveProgress = isActiveRoleForStatus(SESSION.role, statusEff);
  const stageInfo = STAGE_NEXT[statusEff];
  const canAdvance = stageInfo && (SESSION.role === stageInfo.byRole || SESSION.role === "engineer");
  const canRevert = statusEff !== "Draft" && SESSION.role === "engineer";
  const canExportPdf = ["supervisor","superintendent","engineer"].includes(SESSION.role);
  const canExportDay = SESSION.role === "engineer";
  const viewOnlyNote = (!canSaveProgress && !isFinal)
    ? "Mode lihat saja - menunggu " + (STAGE_ACTIVE_ROLE[statusEff]||[]).map(r=>ROLE_LABEL[r]).join("/") + "."
    : "";
  const savebar = el(`
    <div class="savebar no-print">
      ${CURRENT.fromDashboard ? `<button class="btn secondary" onclick="backToDashboard()">← Dashboard</button>` : ""}
      <div class="autosave-note" id="autosaveNote">${viewOnlyNote}</div>
      ${canExportPdf ? `<button class="btn secondary" onclick="window.print()">🖨️ Export PDF</button>` : ""}
      ${canExportDay ? `<button class="btn secondary" onclick="exportDayPdf()">🖨️ Export PDF (1 Hari - Semua Shift)</button>` : ""}
      ${canSaveProgress ? `<button class="btn secondary" onclick="saveProgress(true)">${statusEff==="Draft"?"Simpan Draft":"Simpan"}</button>` : ""}
      ${canAdvance ? `<button class="btn" onclick="advanceStage()">${stageInfo.label}</button>` : ""}
      ${canRevert ? `<button class="btn danger" onclick="revertToDraft()">↩️ Kembalikan ke Draft</button>` : ""}
    </div>
  `);
  app.appendChild(savebar);

  // init signature pads setelah DOM dimasukkan
  setTimeout(()=>{
    ["operator","supervisor","superintendent"].forEach(role=>{
      initSigPad(role, savedSig[role]?.img);
    });
  },0);
}

/* ======================= EXPORT PDF - 1 HARI (SEMUA SHIFT) =======================
 * Engineer bisa mencetak ketiga shift (Pagi/Siang/Malam) dalam satu PDF
 * lewat print-to-PDF browser. */
async function exportDayPdf(){
  const def = CHECKLIST_DATA[CURRENT.checklistKey];
  const tanggal = CURRENT.tanggal, group = CURRENT.group;
  const app = document.getElementById("app");
  const prevHtml = app.innerHTML;
  app.innerHTML = `<div class="msg info"><span class="spinner"></span> Menyiapkan rekap 1 hari...</div>`;
  try{
    const shiftsData = {};
    for(const s of SHIFTS){
      // Tanpa `group` dengan sengaja: ambil Group yang benar-benar bekerja
      // tiap shift hari itu.
      shiftsData[s.id] = await api("getChecklist", {checklistName: CURRENT.checklistKey, tanggal, shift: s.id});
    }
    renderDayPrintView(def, tanggal, group, shiftsData);
    setTimeout(()=>{
      window.print();
      renderChecklistForm();
    }, 300);
  }catch(e){
    app.innerHTML = prevHtml;
    alert("Gagal menyiapkan rekap 1 hari: " + e.message);
  }
}

function buildPrintItemsTable(def, savedItems){
  let lastKat = null, rows = "";
  def.items.forEach((it, idx)=>{
    if(it.kat !== lastKat){ rows += `<tr class="kat-row"><td colspan="5">${it.kat}</td></tr>`; lastKat = it.kat; }
    const saved = savedItems[idx] || {};
    const s = saved.awal || {};
    const kodeBadges = it.kode.split("").map(k=>`<span class="kode-badge">${k}</span>`).join(" ");
    const catatan = (s.c||"").replace(/</g,"&lt;");
    rows += `<tr><td class="item-col">${it.pos?`<div style="font-size:11px;color:var(--muted)">${it.pos}</div>`:""}${it.item}</td><td>${kodeBadges}</td><td class="std-col">${it.std||""}</td><td>${s.h||"-"}</td><td>${catatan}</td></tr>`;
  });
  const handover = (savedItems._handover && savedItems._handover.text) ? `<div class="msg info" style="margin-top:8px;">📝 Catatan untuk shift berikutnya: ${savedItems._handover.text.replace(/</g,"&lt;")}</div>` : "";
  const metaHtml = (def.fields||[]).map(f=>{
    const v = savedItems._meta && savedItems._meta[f.id];
    return v ? `<p style="margin:4px 0;"><b>${f.label}:</b> ${String(v).replace(/</g,"&lt;")}</p>` : "";
  }).join("");
  return metaHtml + `<div style="overflow-x:auto;"><table class="chk-table"><thead><tr>
      <th>Item Pemeriksaan</th><th>Metode</th><th>Standar</th><th>Hasil</th><th>Catatan</th>
    </tr></thead>
    <tbody>${rows}</tbody></table></div>${handover}`;
}

function buildPrintSigBlock(signaturesJson){
  let sig = {};
  try{ sig = JSON.parse(signaturesJson||"{}"); }catch(e){}
  const boxes = ["operator","supervisor","superintendent"].map(role=>{
    const s = sig[role] || {};
    const imgHtml = s.img ? `<img src="${s.img}" style="max-width:100%;max-height:90px;">` : `<div style="height:70px;border:1px dashed var(--border);"></div>`;
    return `<div class="sig-box"><h4>Tanda Tangan ${ROLE_LABEL[role]}</h4><div class="name">${s.name||"-"}</div>${imgHtml}</div>`;
  }).join("");
  return `<div class="sig-grid">${boxes}</div>`;
}

function renderDayPrintView(def, tanggal, group, shiftsData){
  const app = document.getElementById("app");
  app.innerHTML = "";
  let html = `
    <div class="no-print" style="margin-bottom:16px;">
      <button class="btn secondary" onclick="renderChecklistForm()">← Kembali</button>
    </div>
    <h2>${def.title} — Rekap 1 Hari</h2>
    <p><b>Tanggal:</b> ${tanggal}</p>
  `;
  // Tiap shift bisa punya Group sendiri, jadi ditampilkan per blok shift.
  SHIFTS.forEach(s=>{
    const rec = shiftsData[s.id];
    const found = rec && rec.found;
    let savedItems = {};
    if(found && rec.dataJson){ try{ savedItems = JSON.parse(rec.dataJson); }catch(e){} }
    html += `
      <div style="page-break-inside:avoid;margin:24px 0;">
        <h3>Shift ${s.label} ${found && rec.group ? `&nbsp; <small style="color:var(--muted);font-weight:400;">Group ${rec.group}</small>`:""} &nbsp; <span class="status-badge ${statusBadgeClass(found ? rec.status : 'Draft')}">${found ? rec.status : 'BELUM ADA DATA'}</span></h3>
        ${buildPrintItemsTable(def, savedItems)}
        ${found ? buildPrintSigBlock(rec.signatures) : ''}
      </div>
    `;
  });
  app.appendChild(el(html));
}

function onHasilChange(sel){
  sel.className = "hasil-sel " + sel.value.toLowerCase();
  markDirty();
}

function markDirty(){
  dirty = true;
  const note = document.getElementById("autosaveNote");
  if(note) note.textContent = "Ada perubahan belum tersimpan...";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveProgress(false), 2500);
}

function collectFormData(){
  const def = CHECKLIST_DATA[CURRENT.checklistKey];
  const data = {};
  def.items.forEach((it, idx)=>{
    const hSel = document.querySelector(`.hasil-sel[data-idx="${idx}"][data-slot="awal"]`);
    const cInp = document.querySelector(`.catatan-inp[data-idx="${idx}"][data-slot="awal"]`);
    const h = hSel ? hSel.value : "";
    const c = cInp ? cInp.value : "";
    if(h || c) data[idx] = {awal: {h, c}};
  });
  const handoverEl = document.getElementById("handover-note");
  if(handoverEl && handoverEl.value.trim()){
    data._handover = {text: handoverEl.value};
  }
  const meta = {};
  document.querySelectorAll(".meta-inp").forEach(inp=>{
    const v = inp.value.trim();
    if(v) meta[inp.getAttribute("data-meta")] = v;
  });
  if(Object.keys(meta).length) data._meta = meta;
  const signatures = {};
  ["operator","supervisor","superintendent"].forEach(role=>{
    const pad = CURRENT.sigPads[role];
    if(pad){
      signatures[role] = { name: pad.nameOverride || (document.querySelector(`#sig-${role}`).closest(".sig-box").querySelector(".name").textContent), img: pad.hasDrawing ? pad.canvas.toDataURL("image/png") : (pad.existingImg || "") };
    }
  });
  return {dataJson: JSON.stringify(data), signatures: JSON.stringify(signatures)};
}

// Menyimpan item/handover/tanda tangan TANPA mengubah status (dipakai
// autosave dan tombol "Simpan"). Izin juga ditegakkan di server.
async function saveProgress(manual){
  const statusEff = (CURRENT.record && CURRENT.record.found) ? CURRENT.record.status : "Draft";
  if(!isActiveRoleForStatus(SESSION.role, statusEff)) return;
  if(!CURRENT.group){ if(manual) alert("Pilih Group terlebih dahulu sebelum menyimpan."); return; }
  const note = document.getElementById("autosaveNote");
  if(manual && note) note.innerHTML = `<span class="spinner"></span> Menyimpan...`;
  const payload = Object.assign({
    checklistName: CURRENT.checklistKey, tanggal: CURRENT.tanggal, shift: CURRENT.shift, group: CURRENT.group
  }, collectFormData());
  try{
    const data = await api("saveProgress", payload);
    CURRENT.record = data;
    dirty = false;
    if(note) note.textContent = "Tersimpan • " + new Date().toLocaleTimeString();
    if(manual) refreshStatusBadge();
  }catch(e){
    if(note) note.innerHTML = `<span style="color:var(--bad)">Gagal menyimpan: ${e.message}</span>`;
  }
}
function canEditRoleOrEngineer(){ return canEditRole(); }

function refreshStatusBadge(){
  renderChecklistForm();
}

// Mendorong laporan ke tahap BERIKUTNYA (STAGE_NEXT[statusSaatIni]).
async function advanceStage(){
  const statusEff = (CURRENT.record && CURRENT.record.found) ? CURRENT.record.status : "Draft";
  const stageInfo = STAGE_NEXT[statusEff];
  if(!stageInfo) return;
  if(!CURRENT.group){ alert("Pilih Group terlebih dahulu sebelum mengirim laporan."); return; }
  // Cek lokal tanda tangan (server tetap menegakkan juga).
  const pad = CURRENT.sigPads[stageInfo.needsSig];
  const hasSig = pad && (pad.hasDrawing || pad.existingImg);
  if(!hasSig){ alert("Tanda tangan " + ROLE_LABEL[stageInfo.needsSig] + " wajib diisi terlebih dahulu."); return; }
  const confirmMsg = stageInfo.nextStatus === "Final"
    ? "Kirim laporan sebagai FINAL? Setelah final, operator & supervisor tidak bisa mengubah/melihat lagi (kecuali dibuka kembali oleh Engineer)."
    : `${stageInfo.label}? Setelah dikirim, laporan ini tidak bisa diedit lagi kecuali dibuka kembali oleh Engineer.`;
  if(!confirm(confirmMsg)) return;
  const payload = Object.assign({
    checklistName: CURRENT.checklistKey, tanggal: CURRENT.tanggal, shift: CURRENT.shift, group: CURRENT.group
  }, collectFormData());
  try{
    const data = await api(stageInfo.action, payload);
    CURRENT.record = data;
    alert(stageInfo.nextStatus === "Final" ? "Laporan berhasil dikirim sebagai FINAL." : "Laporan berhasil dikirim ke tahap " + stageInfo.nextStatus + ".");
    renderChecklistForm();
  }catch(e){
    alert("Gagal mengirim: " + e.message);
  }
}

async function revertToDraft(){
  if(!confirm("Kembalikan laporan ini menjadi DRAFT? Operator/Supervisor akan bisa mengedit kembali.")) return;
  try{
    const data = await api("setDraft", {id: CURRENT.record.id});
    CURRENT.record = data;
    alert("Laporan dikembalikan ke status DRAFT.");
    renderChecklistForm();
  }catch(e){
    alert("Gagal: " + e.message);
  }
}

/* ======================= SIGNATURE PAD ======================= */
function initSigPad(role, existingImg){
  const canvas = document.getElementById("sig-"+role);
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  // Tanda tangan selalu hitam pekat, apa pun tema light/dark, supaya
  // terbaca di "Form Fisik" putih.
  ctx.strokeStyle = "#000000";
  let drawing = false, hasDrawing = false;
  const pad = { canvas, ctx, hasDrawing:false, existingImg: existingImg||"", nameOverride:null };
  CURRENT.sigPads[role] = pad;

  if(existingImg){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img,0,0,canvas.width/ratio,canvas.height/ratio); };
    img.src = existingImg;
  }

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX - r.left, y: p.clientY - r.top};
  }
  function start(e){
    if(canvas.disabled) return;
    if(canvas.closest(".sig-box").querySelector("button").disabled) return;
    drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault();
  }
  function move(e){
    if(!drawing) return;
    const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); pad.hasDrawing = true; markDirty(); e.preventDefault();
  }
  function end(){ drawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start);
  canvas.addEventListener("touchmove", move);
  canvas.addEventListener("touchend", end);
}

function clearSig(role){
  const pad = CURRENT.sigPads[role];
  if(!pad) return;
  pad.ctx.clearRect(0,0,pad.canvas.width,pad.canvas.height);
  pad.hasDrawing = false;
  pad.existingImg = "";
  markDirty();
}

function setSigName(role){
  const nameEl = document.querySelector(`#sig-${role}`).closest(".sig-box").querySelector(".name");
  const val = prompt("Nama "+ROLE_LABEL[role]+":", nameEl.textContent==="-" ? "" : nameEl.textContent);
  if(val !== null){
    nameEl.textContent = val;
    CURRENT.sigPads[role].nameOverride = val;
    markDirty();
  }
}

/* ======================= WARN ON LEAVE IF DIRTY ======================= */
window.addEventListener("beforeunload", function(e){
  if(dirty){ e.preventDefault(); e.returnValue = ""; }
});
</script>
</body>
</html>
