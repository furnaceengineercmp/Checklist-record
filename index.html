<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Furnace Area</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --text:#1c2530; --muted:#6b7684; --border:#dde3ea;
  --accent:#2563eb; --accent-d:#1d4ed8; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --head:#eef2f7; --input-bg:#ffffff; --shadow:0 1px 3px rgba(20,30,50,.08);
}
[data-theme="dark"]{
  --bg:#11151c; --panel:#1a2028; --text:#e6eaf0; --muted:#9aa5b3; --border:#2c3542;
  --accent:#3b82f6; --accent-d:#60a5fa; --ok:#22c55e; --warn:#f59e0b; --bad:#f87171;
  --head:#222a35; --input-bg:#151a21; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:var(--shadow);}
.topbar .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
.topbar .brand small{color:var(--muted);font-weight:400;font-size:12px;}
.userbox{display:flex;align-items:center;gap:10px;font-size:13px;}
.pill{padding:2px 10px;border-radius:20px;background:var(--head);border:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
.icon-btn{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;}
.icon-btn:hover{background:var(--head);}
.wrap{max-width:1100px;margin:0 auto;padding:18px;}
.center-wrap{max-width:420px;margin:60px auto;padding:0 16px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--shadow);}
.card h2{margin-top:0;}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;}
input,select,textarea{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;}
textarea{resize:vertical;min-height:44px;}
button.btn{cursor:pointer;border:none;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;}
button.btn:hover{background:var(--accent-d);}
button.btn.secondary{background:var(--head);color:var(--text);border:1px solid var(--border);}
button.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
button.btn.danger{background:var(--bad);color:#fff;}
button.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{font-size:13px;margin-top:10px;padding:9px 11px;border-radius:8px;}
.msg.err{background:#fee2e2;color:#991b1b;}
[data-theme="dark"] .msg.err{background:#3a1a1a;color:#f87171;}
.msg.ok{background:#dcfce7;color:#166534;}
[data-theme="dark"] .msg.ok{background:#12301f;color:#4ade80;}
.msg.info{background:var(--head);color:var(--muted);}
.linklike{color:var(--accent);cursor:pointer;text-decoration:underline;font-size:13px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;}
.menu-tile{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px 18px;text-align:center;cursor:pointer;box-shadow:var(--shadow);}
.menu-tile:hover{border-color:var(--accent);}
.menu-tile .emoji{font-size:34px;}
.menu-tile h3{margin:10px 0 4px;}
.menu-tile p{color:var(--muted);font-size:12.5px;margin:0;}
.chk-list{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.chk-item{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;}
.chk-item:hover{border-color:var(--accent);}
.chk-item .name{font-weight:600;}
.chk-item .sub{font-size:12px;color:var(--muted);}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:6px;}
.breadcrumb span{cursor:pointer;color:var(--accent);}
.crumb-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.crumb-btn{background:var(--panel);border:1px solid var(--border);color:var(--accent);padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);}
.crumb-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.crumb-current{padding:7px 14px;font-size:12.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:20px;}
.crumb-sep{color:var(--muted);font-size:13px;}
.formbar{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:16px;}
.formbar .fld{min-width:150px;flex:1;}
.formbar label{margin:0 0 5px;}
.status-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.3px;}
.status-badge.draft{background:#fef3c7;color:#92400e;}
.status-badge.final{background:#dcfce7;color:#166534;}
.status-badge.pending{background:#dbeafe;color:#1e40af;}
[data-theme="dark"] .status-badge.draft{background:#3a2c0f;color:#fbbf24;}
[data-theme="dark"] .status-badge.final{background:#12301f;color:#4ade80;}
[data-theme="dark"] .status-badge.pending{background:#1e2f4d;color:#60a5fa;}
.sig-box.sig-inactive{opacity:.5;}
.sig-box.sig-inactive .sig-pad{pointer-events:none;}
.locked-box{background:var(--panel);border:1px dashed var(--border);border-radius:14px;padding:60px 20px;text-align:center;color:var(--muted);}
.locked-box .big{font-size:40px;}
.savebar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;z-index:40;}
.autosave-note{font-size:12px;color:var(--muted);margin-right:auto;}
table.chk-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px;}
table.chk-table th{background:var(--head);text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);}
table.chk-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;}
table.chk-table tr.kat-row td{background:var(--head);font-weight:700;padding:6px 8px;font-size:12.5px;}
.kode-badge{display:inline-block;background:var(--head);border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700;color:var(--accent);}
.hasil-sel{width:76px;}
.hasil-sel.v{color:var(--ok);font-weight:700;}
.hasil-sel.x{color:var(--bad);font-weight:700;}
.hasil-sel.o{color:var(--warn);font-weight:700;}
.catatan-inp{min-width:150px;}
.legend{font-size:12px;color:var(--muted);margin:6px 0 14px;}
.sig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px;}
.sig-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;}
.sig-box h4{margin:0 0 4px;font-size:13px;}
.sig-box .name{font-size:12px;color:var(--muted);margin-bottom:6px;}
canvas.sig-pad{width:100%;height:110px;border:1px dashed var(--border);border-radius:8px;background:var(--input-bg);touch-action:none;}
.sig-actions{display:flex;justify-content:space-between;margin-top:6px;}
.sig-actions button{font-size:11px;padding:4px 8px;}
.item-col{min-width:150px;}
.std-col{color:var(--muted);font-size:12px;min-width:170px;}
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:var(--input-bg);color:var(--muted);font-size:11px;cursor:pointer;flex-shrink:0;padding:0;line-height:1;}
.info-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.item-col-wrap{display:flex;align-items:flex-start;gap:6px;}
.catatan-cell{display:flex;align-items:center;gap:6px;}
.catatan-cell .catatan-inp{flex:1;min-width:0;}
.info-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;cursor:pointer;}
.info-modal-box{background:var(--panel);color:var(--text);border-radius:12px;max-width:420px;width:100%;max-height:70vh;overflow-y:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3);cursor:default;}
.info-modal-title{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--accent);}
.info-modal-text{font-size:14px;line-height:1.5;white-space:pre-wrap;}
.info-modal-hint{margin-top:12px;font-size:11px;color:var(--muted);text-align:center;}
@media(max-width:720px){
  .grid2{grid-template-columns:1fr;}
  .menu-grid{grid-template-columns:1fr;}
  table.chk-table{font-size:12px;}
  .std-col{display:none;}
  .metode-col{display:none;}
  .catatan-cell .catatan-inp{min-width:90px;}
}
@media print{
  .topbar,.savebar,.formbar button,.no-print{display:none !important;}
  body{background:#fff;color:#000;}
  .wrap{max-width:100%;padding:0;}
  table.chk-table th, table.chk-table td{border-color:#999;}
}
.hidden{display:none !important;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

function el(html){
  // Returns a DocumentFragment so templates with multiple top-level
  // elements (e.g. a breadcrumb + a grid) are ALL kept when appended,
  // instead of silently dropping everything after the first element.
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content;
}
// Formats a Date object as a plain yyyy-mm-dd string using its LOCAL
// calendar date (year/month/day as the browser's timezone sees them) -
// deliberately NEVER via toISOString(), which converts to UTC first and
// silently rolls the date back a day for anyone in a positive UTC offset
// (e.g. Asia/Jakarta, UTC+7) whenever the local time is near midnight.
// That mismatch was the root cause of "Tanggal 7 Pagi doesn't show the
// handover note from Tanggal 6 Malam" - see prevShiftKey() below.
/* ======================= INFO MODAL (mobile-friendly "read full text") =======================
 * Used for 2 things that get cut off or hidden on a narrow phone screen:
 *  - the "Standar Pemeriksaan" column, which is hidden entirely below
 *    720px (see .std-col{display:none} in the CSS) - tapping the little
 *    ℹ button next to an item's name shows it here instead.
 *  - the "Catatan / Penanganan" text input, which can hold a long
 *    carried-over note from the previous shift that gets visually
 *    truncated inside the narrow input box - tapping the 🔍 button next
 *    to it shows the input's current full value here (read-only; keep
 *    editing in the input itself as usual).
 * Tapping ANYWHERE on the overlay (including the box itself) closes it,
 * per request - there's no separate "close" button needed. */
function showInfoModal(title, text){
  closeInfoModal();
  const overlay = document.createElement("div");
  overlay.className = "info-modal-overlay";
  overlay.onclick = closeInfoModal;
  const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  overlay.innerHTML = `
    <div class="info-modal-box">
      <div class="info-modal-title">${esc(title)}</div>
      <div class="info-modal-text">${esc(text) || "(kosong)"}</div>
      <div class="info-modal-hint">Ketuk di mana saja untuk menutup</div>
    </div>`;
  document.body.appendChild(overlay);
}
function closeInfoModal(){
  const e = document.querySelector(".info-modal-overlay");
  if(e) e.remove();
}
function showCatatanModal(idx){
  const inp = document.getElementById("catatan-"+idx);
  showInfoModal("Catatan / Penanganan", inp ? inp.value : "");
}

function localDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function todayStr(){ return localDateStr(new Date()); }

/* ======================= TIERED APPROVAL STAGES =======================
 * A checklist now moves through 4 statuses in order:
 *   Draft -> Menunggu Supervisor -> Menunggu Superintendent -> Final
 * Each forward step requires that stage's own role to sign their own
 * signature box first, then click that stage's "kirim" button - Operator
 * signs & sends to Supervisor, Supervisor signs & sends to
 * Superintendent, Superintendent signs & finalizes. Engineer can sign
 * ANY box and push ANY stage forward (full override), and is the only
 * role that can send a report back to Draft once it's moved past that
 * (see revertToDraft()/actionSetDraft on the backend - unchanged). */
const STAGE_ORDER = ["Draft","Menunggu Supervisor","Menunggu Superintendent","Final"];
// Whose turn it is to act (edit items/sign/advance) at each status -
// besides Engineer, who can always act at any stage.
const STAGE_ACTIVE_ROLE = {
  "Draft": ["operator","supervisor"],
  "Menunggu Supervisor": ["supervisor"],
  "Menunggu Superintendent": ["superintendent"],
  "Final": []
};
// The next status + who triggers it + which signature box must be filled
// first, keyed by CURRENT status (i.e. "what happens if the active role
// clicks the one action button available at this stage").
const STAGE_NEXT = {
  "Draft": {action:"submitToSupervisor", nextStatus:"Menunggu Supervisor", byRole:"operator", needsSig:"operator", label:"Kirim ke Supervisor"},
  "Menunggu Supervisor": {action:"submitToSuperintendent", nextStatus:"Menunggu Superintendent", byRole:"supervisor", needsSig:"supervisor", label:"Kirim ke Superintendent"},
  "Menunggu Superintendent": {action:"submitFinal", nextStatus:"Final", byRole:"superintendent", needsSig:"superintendent", label:"✅ Kirim Laporan (Final)"}
};
function statusBadgeClass(status){
  if(status === "Final") return "final";
  if(status === "Menunggu Supervisor" || status === "Menunggu Superintendent") return "pending";
  return "draft";
}
// Is the given role (besides engineer, who's always active) the one
// currently allowed to edit items/sign/advance at this status?
function isActiveRoleForStatus(role, status){
  if(role === "engineer") return true;
  return (STAGE_ACTIVE_ROLE[status] || []).indexOf(role) !== -1;
}

// Renders a row of pill-shaped BUTTONS instead of a plain "a / b / c" text
// breadcrumb. `steps` is an array of {label, fn}; the LAST step should
// have no `fn` (rendered as the current, non-clickable step).
function crumbBar(steps){
  const parts = steps.map((s,i)=>{
    const isLast = i === steps.length-1;
    if(!s.fn || isLast){
      return `<span class="crumb-current">${s.label}</span>`;
    }
    return `<button class="crumb-btn" onclick="${s.fn}">${s.label}</button>`;
  });
  return `<div class="crumb-bar no-print">${parts.join('<span class="crumb-sep">›</span>')}</div>`;
}

async function api(action, payload){
  payload = payload || {};
  payload.action = action;
  if(SESSION && SESSION.token) payload.token = SESSION.token;
  const res = await fetch(API_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"}, // avoid CORS preflight
    body: JSON.stringify(payload)
  });
  let json;
  try{ json = await res.json(); }
  catch(e){ throw new Error("Respon server tidak valid. Cek URL Apps Script / deployment."); }
  if(!json.ok){ throw new Error(json.error || "Terjadi kesalahan."); }
  return json.data;
}

async function handleLogin(){
  const msg = document.getElementById("lg-msg");
  msg.innerHTML = `<div class="msg info"><span class="spinner"></span> Memeriksa akun...</div>`;
  const username = document.getElementById("lg-user").value.trim();
  const password = document.getElementById("lg-pass").value;
  if(!username || !password){ msg.innerHTML = `<div class="msg err">Username & password wajib diisi.</div>`; return; }
  try{
    const data = await api("login", {username, password, device: navigator.userAgent});
    SESSION = data; // {token, username, fullName, role, jobTitle}
    localStorage.setItem("cf_session", JSON.stringify(SESSION));
    setUserBox();
    renderHome();
  }catch(e){
    msg.innerHTML = `<div class="msg err">${e.message}</div>`;
  }
}

/* ======================= SETUP: TANGGAL / SHIFT =======================
 * Group is NO LONGER chosen here as a separate step - as soon as
 * Tanggal/Shift are set, the checklist form opens directly. Which Group
 * shows up is resolved automatically on the backend (from whatever was
 * used previously for this shift/date, or the shift right before it) -
 * see resolveGroupForDate_ in Code.gs. The Group itself is then just a
 * dropdown INSIDE the already-open form (in the formbar, above "Kode
 * metode pemeriksaan"), the same spot "Ganti Group" used to be. */
function openChecklistSetup(key){
  CURRENT.checklistKey = key;
  CURRENT.group = null;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const def = CHECKLIST_DATA[key];
  app.appendChild(el(`
    ${crumbBar([{label:"🏠 Menu Utama", fn:"renderHome()"}, {label:"Checklist", fn:"renderChecklistPicker()"}, {label:def.title}])}
    <h2>${def.title}</h2>
    <div class="formbar">
      <div class="fld"><label>Tanggal</label><input type="date" id="su-tanggal" value="${todayStr()}"></div>
      <div class="fld"><label>Shift Kerja</label>
        <select id="su-shift">${SHIFTS.map(s=>`<option value="${s.id}">${s.label}</option>`).join("")}</select>
      </div>
      <div class="fld" style="flex:0;">
        <button class="btn" onclick="openChecklistDirect()">Buka Checklist</button>
      </div>
    </div>
    <div id="su-status"></div>
  `));
}

/* Opens the checklist form right away for the chosen Tanggal/Shift. The
 * Group is resolved automatically on the backend (autoProvision:true also
 * creates an empty Draft row the first time this exact tanggal/shift/group
 * combo is opened, same as before). */
async function openChecklistDirect(){
  const tanggal = document.getElementById("su-tanggal").value;
  const shift = document.getElementById("su-shift").value;
  const statusBox = document.getElementById("su-status");
  if(!tanggal){ statusBox.innerHTML = `<div class="msg err">Pilih tanggal terlebih dahulu.</div>`; return; }
  CURRENT.tanggal = tanggal; CURRENT.shift = shift; CURRENT.group = null;
  statusBox.innerHTML = `<div class="msg info"><span class="spinner"></span> Memuat data...</div>`;
  try{
    const rec = await api("getChecklist", {
      checklistName: CURRENT.checklistKey, tanggal, shift, autoProvision: true
    });
    CURRENT.group = rec.group || null;
    CURRENT.record = rec; // {found, status, dataJson, signatures, group, ...} or {found:false, group}
    await loadPrevShiftHandover();
    renderChecklistForm();
  }catch(e){
    statusBox.innerHTML = `<div class="msg err">${e.message}</div>`;
  }
}

/* Fired from the Group <select> inside the already-open form. Group is
 * NOT part of the data key anymore - there is only ONE record per
 * Tanggal+Shift, no matter which Group is selected. So changing this
 * dropdown never re-fetches anything and never touches the item rows,
 * catatan, or signatures already on screen - it just relabels who filled
 * this shift in, and that label rides along on the next autosave/submit
 * (see saveDraft/submitFinal, which always send CURRENT.group). The one
 * time we DO re-render is when no Group was chosen yet at all (brand new
 * checklist row, table not shown yet) - there is nothing to lose there
 * since the item table isn't on screen yet. */
function onGroupChange(newGroup){
  if(!newGroup || newGroup === CURRENT.group) return;
  const hadNoGroup = !CURRENT.group;
  CURRENT.group = newGroup;
  markDirty();
  if(hadNoGroup) renderChecklistForm();
}

/* Looks up the immediately-preceding shift's handover note (same Group)
 * so it can be shown as a banner at the top of the form - Pagi's
 * previous shift is the PREVIOUS DAY's Malam. Failures are silent
 * (missing/blocked previous record just means no banner is shown). */
function prevShiftKey(tanggal, shift){
  if(shift === "Siang") return {tanggal, shift:"Pagi"};
  if(shift === "Malam") return {tanggal, shift:"Siang"};
  // Pagi -> previous day's Malam. Parsed and re-formatted purely in LOCAL
  // time via localDateStr() (never toISOString()) - see its comment above
  // for why that matters here specifically.
  const d = new Date(tanggal + "T00:00:00");
  d.setDate(d.getDate() - 1);
  return {tanggal: localDateStr(d), shift:"Malam"};
}

async function loadPrevShiftHandover(){
  CURRENT.prevHandover = null;
  CURRENT.prevOpenItems = {};
  try{
    const prev = prevShiftKey(CURRENT.tanggal, CURRENT.shift);
    // No `group` sent on purpose: the previous shift's note should show up
    // regardless of which Group filled it in (and `autoProvision` is left
    // off too, so just peeking here never creates a phantom draft row for
    // a shift nobody actually opened).
    const prevRec = await api("getChecklist", {
      checklistName: CURRENT.checklistKey, tanggal: prev.tanggal, shift: prev.shift
    });
    // `.handover` and `.openItems` come straight from the backend now, and
    // are ALWAYS populated regardless of role or whether that previous
    // shift's report is Final-locked - every role needs to see this
    // operational handover info, even operator/supervisor who otherwise
    // can't see a locked shift's full itemized data (see
    // extractContinuityInfo_ in Code.gs).
    if(prevRec && prevRec.found){
      if(prevRec.handover){
        CURRENT.prevHandover = {text: prevRec.handover, shiftLabel: SHIFTS.find(s=>s.id===prev.shift).label, tanggal: prev.tanggal};
      }
      if(prevRec.openItems){
        CURRENT.prevOpenItems = prevRec.openItems;
      }
    }
  }catch(e){ /* silent - banner just won't show */ }
}

/* ======================= CHECKLIST FORM ======================= */
function canEditRole(){
  return SESSION.role === "operator" || SESSION.role === "supervisor" || SESSION.role === "engineer";
}
function isLockedForMe(rec){
  if(!rec || !rec.found) return false;
  if(rec.status !== "Final") return false;
  // Final: locked (hidden) for operator & supervisor; visible for superintendent & engineer
  return (SESSION.role === "operator" || SESSION.role === "supervisor");
}

// Only Operator/Supervisor ever edit the actual checklist items, and only
// while the report is still at "Draft" (before Operator sends it up the
// chain) - Superintendent NEVER edits items, only signs their own box at
// their own stage. Engineer can always edit everything, at any stage
// (full override), same as it can always sign any box.
const ITEM_EDIT_ROLES = ["operator","supervisor"];
function itemsReadOnlyFor(statusEff){
  if(SESSION.role === "engineer") return false;
  return !(statusEff === "Draft" && ITEM_EDIT_ROLES.indexOf(SESSION.role) !== -1);
}
// Which status each role's OWN signature box requires to be editable -
// Engineer can edit any box at any status.
const SIG_ROLE_STATUS = {"operator":"Draft","supervisor":"Menunggu Supervisor","superintendent":"Menunggu Superintendent"};
function sigEditableFor(role, statusEff){
  if(SESSION.role === "engineer") return true;
  if(SESSION.role !== role) return false;
  return statusEff === SIG_ROLE_STATUS[role];
}

function renderChecklistForm(){
  const app = document.getElementById("app");
  const def = CHECKLIST_DATA[CURRENT.checklistKey];
  const rec = CURRENT.record;
  app.innerHTML = "";

  // statusEff: the record's real status once it exists, else "Draft" -
  // every permission check below (items, group, each signature box, the
  // stage-advance button) is driven off this one value, per the tiered
  // approval chain: Draft -> Menunggu Supervisor -> Menunggu
  // Superintendent -> Final. See STAGE_NEXT/itemsReadOnlyFor/
  // sigEditableFor above.
  const statusEff = (rec && rec.found) ? rec.status : "Draft";
  const itemsReadOnly = itemsReadOnlyFor(statusEff);
  const isFinal = statusEff === "Final";

  const header = el(`
    ${crumbBar([{label:"🏠 Menu Utama", fn:"renderHome()"}, {label:"Checklist", fn:"renderChecklistPicker()"}, {label:def.title, fn:`openChecklistSetup('${CURRENT.checklistKey}')`}, {label:"Isi Form"}])}
    <h2>${def.title} &nbsp; <small style="color:var(--muted);font-weight:400;">v.${def.version}</small></h2>
    <div class="formbar">
      <div class="fld"><label>Tanggal</label><div><b>${CURRENT.tanggal}</b></div></div>
      <div class="fld"><label>Shift</label><div><b>${SHIFTS.find(s=>s.id===CURRENT.shift).label}</b></div></div>
      <div class="fld">
        <label>Group</label>
        <select id="group-select" onchange="onGroupChange(this.value)" ${itemsReadOnly?"disabled":""} title="Group hanya keterangan siapa yang mengisi - tidak memengaruhi data checklist di tanggal/shift ini.">
          <option value="" ${!CURRENT.group?"selected disabled":""}>-</option>
          ${GROUPS.map(g=>`<option value="${g}" ${CURRENT.group===g?"selected":""}>Group ${g}</option>`).join("")}
        </select>
      </div>
      <div class="fld"><label>Status</label><div><span class="status-badge ${statusBadgeClass(statusEff)}">${rec && rec.found ? rec.status : 'BELUM ADA DATA'}</span></div></div>
      <div class="fld" style="flex:0;"><button class="btn secondary" onclick="openChecklistSetup('${CURRENT.checklistKey}')">Ganti Tanggal/Shift</button></div>
    </div>
  `);
  app.appendChild(header);

  if(!CURRENT.group){
    app.appendChild(el(`
      <div class="msg info" style="margin-bottom:16px;">
        ⚠️ Checklist untuk tanggal/shift ini belum pernah diisi Group manapun. Pilih Group pada dropdown di atas untuk mulai mengisi (pilihan ini akan otomatis diingat untuk pengisian berikutnya - dan berlaku untuk tanggal/shift ini saja, apa pun Group yang dipilih setelahnya).
      </div>
    `));
    return;
  }

  // Previous-shift handover note - shown to EVERY role (Operator,
  // Supervisor, Superintendent, Engineer alike), even when that previous
  // shift is already Final and locked, because knowing what the last
  // shift flagged matters to whoever is filling in THIS shift regardless
  // of role. Only this one note is exempt from the lock - the rest of
  // that previous shift's data stays hidden from Operator/Supervisor per
  // the usual rule (see isLockedForMe() below, which is unaffected).
  if(CURRENT.prevHandover){
    app.appendChild(el(`
      <div class="msg info" style="margin-bottom:16px;">
        📝 <b>Catatan dari shift ${CURRENT.prevHandover.shiftLabel} (${CURRENT.prevHandover.tanggal}):</b><br>
        ${String(CURRENT.prevHandover.text).replace(/</g,"&lt;").replace(/\n/g,"<br>")}
      </div>
    `));
  }

  if(isLockedForMe(rec)){
    app.appendChild(el(`
      <div class="locked-box">
        <div class="big">🔒</div>
        <h3>Laporan periode ini sudah FINAL</h3>
        <p>Laporan untuk tanggal/shift ini sudah dikirim final oleh shift bertugas dan terkunci.<br>
        Hubungi Engineer jika perlu perubahan.</p>
      </div>
    `));
    return;
  }

  // build item rows grouped by kategori
  const savedItems = (rec && rec.found && rec.dataJson) ? JSON.parse(rec.dataJson) : {};
  const prevOpenItems = CURRENT.prevOpenItems || {};
  let lastKat = null;
  let rows = "";
  def.items.forEach((it, idx)=>{
    if(it.kat !== lastKat){
      rows += `<tr class="kat-row"><td colspan="5">${it.kat}</td></tr>`;
      lastKat = it.kat;
    }
    const saved = savedItems[idx] || {};
    const s = saved.awal || {};
    // Carry-over: if the PREVIOUS shift left this exact item as X
    // (Abnormal, belum tertangani) with a catatan, and THIS shift hasn't
    // written anything of its own for it yet, pre-fill the catatan field
    // with that carried-over note - still a normal editable text field,
    // so this shift can add to it (e.g. note it's now handled) once they
    // pick a new Hasil. Never overwrites a catatan this shift already has.
    let catatanVal = s.c || "";
    let carriedOver = false;
    if(!catatanVal && !s.h && prevOpenItems[idx]){
      catatanVal = "↪ Belum tertangani (shift sebelumnya): " + prevOpenItems[idx];
      carriedOver = true;
    }
    const kodeBadges = it.kode.split("").map(k=>`<span class="kode-badge" title="${KODE_KETERANGAN[k]||k}">${k}</span>`).join(" ");
    const escAttr = s => String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const itemTitleAttr = escAttr(it.item);
    const stdAttr = escAttr(it.std || "(tidak ada standar tercatat)");
    rows += `
      <tr${carriedOver ? ' style="box-shadow:inset 3px 0 0 var(--bad);"' : ''}>
        <td class="item-col">
          <div class="item-col-wrap">
            <div>${it.pos ? `<div style="font-size:11px;color:var(--muted)">${it.pos}</div>`:""}${it.item}</div>
            <button type="button" class="info-btn" title="Lihat standar pemeriksaan" onclick="showInfoModal(this.dataset.title, this.dataset.std)" data-title="${itemTitleAttr}" data-std="${stdAttr}">ℹ</button>
          </div>
        </td>
        <td class="metode-col">${kodeBadges}</td>
        <td class="std-col">${it.std || ""}</td>
        <td>
          <select class="hasil-sel ${(s.h||"").toLowerCase()}" data-idx="${idx}" data-slot="awal" onchange="onHasilChange(this)" ${itemsReadOnly?"disabled":""}>
            <option value="" ${!s.h?"selected":""}>-</option>
            <option value="V" ${s.h==="V"?"selected":""}>V (Normal)</option>
            <option value="X" ${s.h==="X"?"selected":""}>X (Abnormal)</option>
            <option value="O" ${s.h==="O"?"selected":""}>O (Tertangani)</option>
          </select>
        </td>
        <td>
          <div class="catatan-cell">
            <input class="catatan-inp" id="catatan-${idx}" data-idx="${idx}" data-slot="awal" placeholder="Catatan / penanganan" value="${catatanVal.replace(/"/g,'&quot;')}" oninput="markDirty()" ${itemsReadOnly?"disabled":""}>
            <button type="button" class="info-btn" title="Lihat catatan lengkap" onclick="showCatatanModal(${idx})">🔍</button>
          </div>
        </td>
      </tr>`;
  });

  const table = el(`
    <div class="legend">Kode metode pemeriksaan — <span class="kode-badge">V</span> Visual &nbsp; <span class="kode-badge">S</span> Suara &nbsp; <span class="kode-badge">T</span> Sentuh &nbsp; <span class="kode-badge">B</span> Bau &nbsp;|&nbsp; Hasil: V=Normal, X=Abnormal tidak tertangani, O=Abnormal tertangani &nbsp;|&nbsp; <span style="box-shadow:inset 3px 0 0 var(--bad);padding-left:4px;">garis merah</span> = belum tertangani dari shift sebelumnya</div>
    <div style="overflow-x:auto;">
    <table class="chk-table" id="chk-table">
      <thead>
        <tr>
          <th>Item Pemeriksaan</th>
          <th class="metode-col">Metode</th>
          <th>Standar Pemeriksaan</th>
          <th>Hasil</th>
          <th>Catatan / Penanganan</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  `);
  app.appendChild(table);

  // handover note for the NEXT shift
  const handoverText = (savedItems._handover && savedItems._handover.text) || "";
  app.appendChild(el(`
    <div class="sig-box" style="margin-top:20px;">
      <h4>Catatan untuk Shift Berikutnya (jika ada issue)</h4>
      <textarea id="handover-note" rows="3" placeholder="Tulis catatan/serah-terima untuk shift berikutnya di sini (opsional)" oninput="markDirty()" ${itemsReadOnly?"disabled":""}>${handoverText.replace(/</g,"&lt;")}</textarea>
    </div>
  `));

  // signatures - each box is only editable by ITS OWN role, and only at
  // that role's own stage in the chain (Engineer can edit any of the 3
  // at any stage, as a full override).
  const savedSig = (rec && rec.found && rec.signatures) ? JSON.parse(rec.signatures) : {};
  app.appendChild(el(`<div class="sig-grid" id="sig-grid"></div>`));
  const sigWrap = document.getElementById("sig-grid");
  ["operator","supervisor","superintendent"].forEach(role=>{
    const editable = sigEditableFor(role, statusEff);
    const box = el(`
      <div class="sig-box ${editable?"":"sig-inactive"}">
        <h4>Tanda Tangan ${ROLE_LABEL[role]}</h4>
        <div class="name">${savedSig[role]?.name || (SESSION.role===role ? SESSION.fullName : "-")}</div>
        <canvas class="sig-pad" id="sig-${role}"></canvas>
        <div class="sig-actions">
          <button class="btn secondary" onclick="clearSig('${role}')" ${editable?"":"disabled"}>Bersihkan</button>
          <button class="btn ghost" onclick="setSigName('${role}')" ${editable?"":"disabled"}>Isi Nama</button>
        </div>
      </div>`);
    sigWrap.appendChild(box);
  });

  // savebar - "Simpan" is available to whoever can currently act at this
  // stage (see isActiveRoleForStatus), the one stage-advance button shown
  // is whichever one applies to the CURRENT status (see STAGE_NEXT), and
  // "Kembalikan ke Draft" now works from ANY non-Draft status (not just
  // Final) so Engineer can unwind a wrong stage just as easily.
  const canSaveProgress = isActiveRoleForStatus(SESSION.role, statusEff);
  const stageInfo = STAGE_NEXT[statusEff];
  const canAdvance = stageInfo && (SESSION.role === stageInfo.byRole || SESSION.role === "engineer");
  const canRevert = statusEff !== "Draft" && SESSION.role === "engineer";
  const canExportPdf = ["supervisor","superintendent","engineer"].includes(SESSION.role);
  const canExportDay = SESSION.role === "engineer";
  const viewOnlyNote = (!canSaveProgress && !isFinal)
    ? "Mode lihat saja - menunggu " + (STAGE_ACTIVE_ROLE[statusEff]||[]).map(r=>ROLE_LABEL[r]).join("/") + "."
    : "";
  const savebar = el(`
    <div class="savebar no-print">
      <div class="autosave-note" id="autosaveNote">${viewOnlyNote}</div>
      ${canExportPdf ? `<button class="btn secondary" onclick="window.print()">🖨️ Export PDF</button>` : ""}
      ${canExportDay ? `<button class="btn secondary" onclick="exportDayPdf()">🖨️ Export PDF (1 Hari - Semua Shift)</button>` : ""}
      ${canSaveProgress ? `<button class="btn secondary" onclick="saveProgress(true)">${statusEff==="Draft"?"Simpan Draft":"Simpan"}</button>` : ""}
      ${canAdvance ? `<button class="btn" onclick="advanceStage()">${stageInfo.label}</button>` : ""}
      ${canRevert ? `<button class="btn danger" onclick="revertToDraft()">↩️ Kembalikan ke Draft</button>` : ""}
    </div>
  `);
  app.appendChild(savebar);

  // init signature pads after DOM insert
  setTimeout(()=>{
    ["operator","supervisor","superintendent"].forEach(role=>{
      initSigPad(role, savedSig[role]?.img);
    });
  },0);
}

/* ======================= EXPORT PDF - 1 HARI (SEMUA SHIFT) =======================
 * Lets Engineer print/export all 3 shifts (Pagi/Siang/Malam) of one day +
 * group in a single PDF, instead of opening & printing each shift one by
 * one. Fetches the 3 shift records, renders a read-only combined view,
 * then reuses the browser's own print-to-PDF (same mechanism as the
 * existing per-shift "Export PDF" button). */
async function exportDayPdf(){
  const def = CHECKLIST_DATA[CURRENT.checklistKey];
  const tanggal = CURRENT.tanggal, group = CURRENT.group;
  const app = document.getElementById("app");
  const prevHtml = app.innerHTML;
  app.innerHTML = `<div class="msg info"><span class="spinner"></span> Menyiapkan rekap 1 hari...</div>`;
  try{
    const shiftsData = {};
    for(const s of SHIFTS){
      // No `group` sent on purpose: pick up whichever Group actually
      // worked each shift that day, same as the physical Form Fisik does,
      // instead of forcing all 3 shifts to the currently-viewed Group.
      shiftsData[s.id] = await api("getChecklist", {checklistName: CURRENT.checklistKey, tanggal, shift: s.id});
    }
    renderDayPrintView(def, tanggal, group, shiftsData);
    setTimeout(()=>{
      window.print();
      renderChecklistForm();
    }, 300);
  }catch(e){
    app.innerHTML = prevHtml;
    alert("Gagal menyiapkan rekap 1 hari: " + e.message);
  }
}

function buildPrintItemsTable(def, savedItems){
  let lastKat = null, rows = "";
  def.items.forEach((it, idx)=>{
    if(it.kat !== lastKat){ rows += `<tr class="kat-row"><td colspan="5">${it.kat}</td></tr>`; lastKat = it.kat; }
    const saved = savedItems[idx] || {};
    const s = saved.awal || {};
    const kodeBadges = it.kode.split("").map(k=>`<span class="kode-badge">${k}</span>`).join(" ");
    const catatan = (s.c||"").replace(/</g,"&lt;");
    rows += `<tr><td class="item-col">${it.pos?`<div style="font-size:11px;color:var(--muted)">${it.pos}</div>`:""}${it.item}</td><td>${kodeBadges}</td><td class="std-col">${it.std||""}</td><td>${s.h||"-"}</td><td>${catatan}</td></tr>`;
  });
  const handover = (savedItems._handover && savedItems._handover.text) ? `<div class="msg info" style="margin-top:8px;">📝 Catatan untuk shift berikutnya: ${savedItems._handover.text.replace(/</g,"&lt;")}</div>` : "";
  return `<div style="overflow-x:auto;"><table class="chk-table"><thead><tr>
      <th>Item Pemeriksaan</th><th>Metode</th><th>Standar</th><th>Hasil</th><th>Catatan</th>
    </tr></thead>
    <tbody>${rows}</tbody></table></div>${handover}`;
}

function buildPrintSigBlock(signaturesJson){
  let sig = {};
  try{ sig = JSON.parse(signaturesJson||"{}"); }catch(e){}
  const boxes = ["operator","supervisor","superintendent"].map(role=>{
    const s = sig[role] || {};
    const imgHtml = s.img ? `<img src="${s.img}" style="max-width:100%;max-height:90px;">` : `<div style="height:70px;border:1px dashed var(--border);"></div>`;
    return `<div class="sig-box"><h4>Tanda Tangan ${ROLE_LABEL[role]}</h4><div class="name">${s.name||"-"}</div>${imgHtml}</div>`;
  }).join("");
  return `<div class="sig-grid">${boxes}</div>`;
}

function renderDayPrintView(def, tanggal, group, shiftsData){
  const app = document.getElementById("app");
  app.innerHTML = "";
  let html = `
    <div class="no-print" style="margin-bottom:16px;">
      <button class="btn secondary" onclick="renderChecklistForm()">← Kembali</button>
    </div>
    <h2>${def.title} — Rekap 1 Hari</h2>
    <p><b>Tanggal:</b> ${tanggal}</p>
  `;
  // Each shift can have its OWN Group (Group is just a label per
  // tanggal+shift now, not a filter) - so it's shown per shift block
  // below instead of a single day-wide Group in the header above.
  SHIFTS.forEach(s=>{
    const rec = shiftsData[s.id];
    const found = rec && rec.found;
    let savedItems = {};
    if(found && rec.dataJson){ try{ savedItems = JSON.parse(rec.dataJson); }catch(e){} }
    html += `
      <div style="page-break-inside:avoid;margin:24px 0;">
        <h3>Shift ${s.label} ${found && rec.group ? `&nbsp; <small style="color:var(--muted);font-weight:400;">Group ${rec.group}</small>`:""} &nbsp; <span class="status-badge ${statusBadgeClass(found ? rec.status : 'Draft')}">${found ? rec.status : 'BELUM ADA DATA'}</span></h3>
        ${buildPrintItemsTable(def, savedItems)}
        ${found ? buildPrintSigBlock(rec.signatures) : ''}
      </div>
    `;
  });
  app.appendChild(el(html));
}

function onHasilChange(sel){
  sel.className = "hasil-sel " + sel.value.toLowerCase();
  markDirty();
}

function markDirty(){
  dirty = true;
  const note = document.getElementById("autosaveNote");
  if(note) note.textContent = "Ada perubahan belum tersimpan...";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveProgress(false), 2500);
}

function collectFormData(){
  const def = CHECKLIST_DATA[CURRENT.checklistKey];
  const data = {};
  def.items.forEach((it, idx)=>{
    const hSel = document.querySelector(`.hasil-sel[data-idx="${idx}"][data-slot="awal"]`);
    const cInp = document.querySelector(`.catatan-inp[data-idx="${idx}"][data-slot="awal"]`);
    const h = hSel ? hSel.value : "";
    const c = cInp ? cInp.value : "";
    if(h || c) data[idx] = {awal: {h, c}};
  });
  const handoverEl = document.getElementById("handover-note");
  if(handoverEl && handoverEl.value.trim()){
    data._handover = {text: handoverEl.value};
  }
  const signatures = {};
  ["operator","supervisor","superintendent"].forEach(role=>{
    const pad = CURRENT.sigPads[role];
    if(pad){
      signatures[role] = { name: pad.nameOverride || (document.querySelector(`#sig-${role}`).closest(".sig-box").querySelector(".name").textContent), img: pad.hasDrawing ? pad.canvas.toDataURL("image/png") : (pad.existingImg || "") };
    }
  });
  return {dataJson: JSON.stringify(data), signatures: JSON.stringify(signatures)};
}

// Saves the current items/handover/signatures WITHOUT changing the
// report's status - this is what autosave uses, and what the "Simpan"
// button in the savebar calls, at every stage of the tiered approval
// chain (Draft, Menunggu Supervisor, Menunggu Superintendent all use
// this same function; only the STAGE-ADVANCE action below changes
// status). Whether the current role is even allowed to save right now
// is enforced server-side (and mirrored client-side via
// isActiveRoleForStatus, which is what decides whether the "Simpan"
// button is shown at all).
async function saveProgress(manual){
  const statusEff = (CURRENT.record && CURRENT.record.found) ? CURRENT.record.status : "Draft";
  if(!isActiveRoleForStatus(SESSION.role, statusEff)) return;
  if(!CURRENT.group){ if(manual) alert("Pilih Group terlebih dahulu sebelum menyimpan."); return; }
  const note = document.getElementById("autosaveNote");
  if(manual && note) note.innerHTML = `<span class="spinner"></span> Menyimpan...`;
  const payload = Object.assign({
    checklistName: CURRENT.checklistKey, tanggal: CURRENT.tanggal, shift: CURRENT.shift, group: CURRENT.group
  }, collectFormData());
  try{
    const data = await api("saveProgress", payload);
    CURRENT.record = data;
    dirty = false;
    if(note) note.textContent = "Tersimpan • " + new Date().toLocaleTimeString();
    if(manual) refreshStatusBadge();
  }catch(e){
    if(note) note.innerHTML = `<span style="color:var(--bad)">Gagal menyimpan: ${e.message}</span>`;
  }
}
function canEditRoleOrEngineer(){ return canEditRole(); }

function refreshStatusBadge(){
  renderChecklistForm();
}

// Pushes the report to the NEXT stage in the tiered approval chain
// (STAGE_NEXT[currentStatus]) - Operator sends Draft to Supervisor,
// Supervisor sends it to Superintendent, Superintendent finalizes it.
// Whichever stage applies right now is the only one ever offered - see
// STAGE_NEXT and the single button rendered for it in renderChecklistForm.
async function advanceStage(){
  const statusEff = (CURRENT.record && CURRENT.record.found) ? CURRENT.record.status : "Draft";
  const stageInfo = STAGE_NEXT[statusEff];
  if(!stageInfo) return;
  if(!CURRENT.group){ alert("Pilih Group terlebih dahulu sebelum mengirim laporan."); return; }
  // Quick local check so a missing signature doesn't need a round-trip to
  // the server to be caught (the server enforces this too either way).
  const pad = CURRENT.sigPads[stageInfo.needsSig];
  const hasSig = pad && (pad.hasDrawing || pad.existingImg);
  if(!hasSig){ alert("Tanda tangan " + ROLE_LABEL[stageInfo.needsSig] + " wajib diisi terlebih dahulu."); return; }
  const confirmMsg = stageInfo.nextStatus === "Final"
    ? "Kirim laporan sebagai FINAL? Setelah final, operator & supervisor tidak bisa mengubah/melihat lagi (kecuali dibuka kembali oleh Engineer)."
    : `${stageInfo.label}? Setelah dikirim, laporan ini tidak bisa diedit lagi kecuali dibuka kembali oleh Engineer.`;
  if(!confirm(confirmMsg)) return;
  const payload = Object.assign({
    checklistName: CURRENT.checklistKey, tanggal: CURRENT.tanggal, shift: CURRENT.shift, group: CURRENT.group
  }, collectFormData());
  try{
    const data = await api(stageInfo.action, payload);
    CURRENT.record = data;
    alert(stageInfo.nextStatus === "Final" ? "Laporan berhasil dikirim sebagai FINAL." : "Laporan berhasil dikirim ke tahap " + stageInfo.nextStatus + ".");
    renderChecklistForm();
  }catch(e){
    alert("Gagal mengirim: " + e.message);
  }
}

async function revertToDraft(){
  if(!confirm("Kembalikan laporan ini menjadi DRAFT? Operator/Supervisor akan bisa mengedit kembali.")) return;
  try{
    const data = await api("setDraft", {id: CURRENT.record.id});
    CURRENT.record = data;
    alert("Laporan dikembalikan ke status DRAFT.");
    renderChecklistForm();
  }catch(e){
    alert("Gagal: " + e.message);
  }
}

/* ======================= SIGNATURE PAD ======================= */
function initSigPad(role, existingImg){
  const canvas = document.getElementById("sig-"+role);
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  // Always draw the actual signature stroke in solid black, regardless of
  // the app's light/dark theme. --text is whatever color is readable on
  // THIS screen (often a light gray/white in dark mode) - using it here
  // meant every signature saved in dark mode came out as a barely-visible
  // gray squiggle once exported onto the white "Form Fisik" sheet. A real
  // signature needs to look like ink on paper independent of UI theme.
  ctx.strokeStyle = "#000000";
  let drawing = false, hasDrawing = false;
  const pad = { canvas, ctx, hasDrawing:false, existingImg: existingImg||"", nameOverride:null };
  CURRENT.sigPads[role] = pad;

  if(existingImg){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img,0,0,canvas.width/ratio,canvas.height/ratio); };
    img.src = existingImg;
  }

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX - r.left, y: p.clientY - r.top};
  }
  function start(e){
    if(canvas.disabled) return;
    if(canvas.closest(".sig-box").querySelector("button").disabled) return;
    drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault();
  }
  function move(e){
    if(!drawing) return;
    const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); pad.hasDrawing = true; markDirty(); e.preventDefault();
  }
  function end(){ drawing = false; }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start);
  canvas.addEventListener("touchmove", move);
  canvas.addEventListener("touchend", end);
}

function clearSig(role){
  const pad = CURRENT.sigPads[role];
  if(!pad) return;
  pad.ctx.clearRect(0,0,pad.canvas.width,pad.canvas.height);
  pad.hasDrawing = false;
  pad.existingImg = "";
  markDirty();
}

function setSigName(role){
  const nameEl = document.querySelector(`#sig-${role}`).closest(".sig-box").querySelector(".name");
  const val = prompt("Nama "+ROLE_LABEL[role]+":", nameEl.textContent==="-" ? "" : nameEl.textContent);
  if(val !== null){
    nameEl.textContent = val;
    CURRENT.sigPads[role].nameOverride = val;
    markDirty();
  }
}

/* ======================= WARN ON LEAVE IF DIRTY ======================= */
window.addEventListener("beforeunload", function(e){
  if(dirty){ e.preventDefault(); e.returnValue = ""; }
});
